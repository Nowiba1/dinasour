<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dino Runner+ Enhanced</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --text: #e0e0e0;
            --accent: #ff6b6b;
            --gold: #ffd700;
            --panel-bg: rgba(20, 20, 40, 0.95);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', 'Courier New', monospace;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16/9;
            max-height: 100vh;
            background: linear-gradient(180deg, #87CEEB 0%, #f0e6d3 70%, #c8b99a 100%);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 80px rgba(100, 100, 255, 0.3);
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: auto;
        }
        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            justify-content: center;
            gap: 30px;
            pointer-events: none;
            z-index: 10;
        }
        @media (max-width: 768px),
        (hover: none) and (pointer: coarse) {
            #mobile-controls {
                display: flex;
            }
            #game-container {
                border-radius: 0;
                max-width: 100vw;
                aspect-ratio: auto;
                height: 100vh;
            }
        }
        .mobile-btn {
            pointer-events: auto;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .mobile-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.9);
            border-color: #fff;
        }
        #music-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            z-index: 5;
            pointer-events: none;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="music-indicator">🎵 Loading...</div>
        <div id="mobile-controls">
            <button class="mobile-btn" id="btn-jump" title="Jump">⬆️</button>
            <button class="mobile-btn" id="btn-duck" title="Duck">⬇️</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <script>
        // ============================================================
        //  DINO RUNNER+ ENHANCED - Balanced, Beautiful, Full Featured
        // ============================================================
        (function() {
            // ─────────────── CONFIG ───────────────
            const CONFIG = {
                W: 1000,
                H: 562,
                GROUND_Y: 440,
                DINO_X: 120,
                GRAVITY: 0.65,
                JUMP_FORCE: -12.5,
                DOUBLE_JUMP_FORCE: -10,
                INITIAL_SPEED: 5.5,
                MAX_SPEED: 12,
                SPEED_INCREMENT: 0.3,
                SCORE_PER_FRAME: 0.12,
                OBSTACLE_MIN_GAP: 250,
                OBSTACLE_MAX_GAP: 500,
                POWERUP_CHANCE: 0.012,
                BONE_CHANCE: 0.03,
                POWERUP_DURATION: 360,
                SLOWMO_FACTOR: 0.45,
                SKINS: [
                    { id: 'classic', name: 'Classic', color: '#333333', accent: '#666666', unlock: true },
                    { id: 'cool', name: 'Cool Dino', color: '#1a1a2e', accent: '#ffd700', unlock: false,
                        req: 'Score 800+ in one run' },
                    { id: 'corporate', name: 'Corporate', color: '#2c3e50', accent: '#e74c3c', unlock: false,
                        req: 'Beat 3 AIs in one run' },
                    { id: 'chad', name: 'Chad Dino', color: '#8b4513', accent: '#ffd700', unlock: false,
                    req: 'Get daily high score' },
                    { id: 'ninja', name: 'Ninja', color: '#1a1a1a', accent: '#e74c3c', unlock: false,
                        req: 'Score 400+ without powerups' },
                    { id: 'cactus', name: 'Cactus', color: '#2d5a27', accent: '#5a8f3c', unlock: false,
                    req: 'Shield absorb 5 hits' },
                ],
                UPGRADES: [
                    { id: 'speedControl', name: 'Speed Limit', icon: '🐢', costs: [40, 80, 150], effect: [
                            'Max speed -8%', 'Max speed -16%', 'Max speed -25%'
                        ] },
                    { id: 'jumpHeight', name: 'Jump Boost', icon: '🦘', costs: [35, 70, 130], effect: ['+15% jump',
                            '+30% jump', '+50% jump'
                        ] },
                    { id: 'eagleEye', name: 'Eagle Eye', icon: '🦅', costs: [60, 120, 200], effect: ['0.3s warning',
                            '0.5s warning', '0.8s warning'
                        ] },
                    { id: 'luckyPaws', name: 'Lucky Paws', icon: '🍀', costs: [50, 100, 180], effect: ['+20% powerups',
                            '+35% powerups', '+50% powerups'
                        ] },
                    { id: 'ironScales', name: 'Iron Scales', icon: '🛡️', costs: [80, 150, 250], effect: ['1-hit shield',
                            '2-hit shield', '3-hit shield'
                        ] },
                ],
            };

            // ─────────────── STATE ───────────────
            const STATE = {
                screen: 'menu',
                gameMode: 'single',
                running: false,
                dead: false,
                score: 0,
                highScore: 0,
                bones: 0,
                speed: CONFIG.INITIAL_SPEED,
                frame: 0,
                groundScroll: 0,
                shakeTimer: 0,
                shakeIntensity: 0,
                currentSkin: 0,
                skinUnlocks: { classic: true },
                upgradeLevels: {},
                aiBeatCount: 0,
                shieldHitsTotal: 0,
                dailyScore: { date: '', score: 0 },
                leaderboard: [],
                musicMood: 'menu',
                musicTimer: 0,
                dayNight: 0,
                activeEvent: null,
                eventTimer: 0,
                eventCooldown: 300,
            };

            const PLAYER = {
                x: CONFIG.DINO_X,
                y: CONFIG.GROUND_Y,
                vy: 0,
                jumping: false,
                ducking: false,
                doubleJumped: false,
                animFrame: 0,
                animTimer: 0,
                powerup: null,
                powerupTimer: 0,
                shield: false,
                shieldHits: 0,
                shieldMax: 1,
                jetpack: false,
                magnet: false,
                slowmo: false,
                banana: false,
                slipChance: 0,
                slipCooldown: 0,
                inputLag: 0,
                queuedJump: false,
                queuedDuck: false,
            };

            const PLAYER2 = {
                x: CONFIG.DINO_X,
                y: CONFIG.GROUND_Y - 50,
                vy: 0,
                jumping: false,
                ducking: false,
                doubleJumped: false,
                animFrame: 0,
                animTimer: 0,
                dead: false,
                score: 0,
                powerup: null,
                powerupTimer: 0,
                shield: false,
                shieldHits: 0,
                shieldMax: 1,
                jetpack: false,
                magnet: false,
                slowmo: false,
                banana: false,
                slipChance: 0,
                slipCooldown: 0,
                inputLag: 0,
                queuedJump: false,
                queuedDuck: false,
            };

            let obstacles = [];
            let powerups = [];
            let bones = [];
            let particles = [];
            let dustParticles = [];
            let exhaustParticles = [];
            let aiPlayers = [];
            let notifications = [];

            const INPUT = { space: false, down: false, w: false, s: false, touchJump: false, touchDuck: false };

            // Audio
            let audioCtx = null;
            let masterGain = null;
            let musicGain = null;
            let audioEnabled = true;
            let currentMusicSource = null;
            let musicNodes = [];

            // Firebase
            let onlineRef = null;
            let firebaseReady = false;
            let onlineRoom = null;
            let onlinePlayerId = null;
            let onlinePlayers = {};

            // ─────────────── AUDIO SYSTEM ───────────────
            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    masterGain = audioCtx.createGain();
                    masterGain.gain.value = 0.4;
                    masterGain.connect(audioCtx.destination);
                    musicGain = audioCtx.createGain();
                    musicGain.gain.value = 0.15;
                    musicGain.connect(masterGain);
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playTone(freq, dur, type = 'square', vol = 0.3, glide = 0) {
                if (!audioEnabled || !audioCtx) return;
                try {
                    const t = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t);
                    if (glide) osc.frequency.linearRampToValueAtTime(freq + glide, t + dur);
                    gain.gain.setValueAtTime(vol * 0.7, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
                    osc.connect(gain);
                    gain.connect(masterGain);
                    osc.start(t);
                    osc.stop(t + dur);
                } catch (e) {}
            }

            function sfxJump() { playTone(600, 0.1, 'square', 0.25);
                playTone(900, 0.08, 'sine', 0.2); }

            function sfxDoubleJump() { playTone(500, 0.08, 'square', 0.2);
                playTone(1100, 0.12, 'sine', 0.25); }

            function sfxDeath() { playTone(400, 0.3, 'sawtooth', 0.35, -300);
                playTone(150, 0.5, 'triangle', 0.3, -100); }

            function sfxMilestone() { playTone(523, 0.1, 'sine', 0.2);
                playTone(659, 0.1, 'sine', 0.2);
                playTone(784, 0.15, 'sine', 0.25); }

            function sfxPickup() { playTone(880, 0.08, 'sine', 0.2);
                playTone(1100, 0.06, 'sine', 0.18); }

            function sfxBone() { playTone(440, 0.05, 'triangle', 0.15);
                playTone(660, 0.04, 'triangle', 0.12); }

            function sfxShieldBreak() { playTone(200, 0.2, 'sawtooth', 0.4, -150);
                playTone(80, 0.3, 'triangle', 0.5); }

            function sfxPowerup() { playTone(300, 0.06, 'sine', 0.15);
                playTone(500, 0.06, 'sine', 0.15);
                playTone(700, 0.06, 'sine', 0.15);
                playTone(1000, 0.1, 'sine', 0.2); }

            function sfxClick() { playTone(800, 0.04, 'sine', 0.1); }

            // ─────────────── MUSIC SYSTEM (Procedural) ───────────────
            function stopMusic() {
                musicNodes.forEach(n => {
                    try { n.osc.stop(); } catch (e) {}
                    try { n.gain.disconnect(); } catch (e) {}
                });
                musicNodes = [];
                currentMusicSource = null;
            }

            function playMusicMood(mood) {
                if (!audioEnabled || !audioCtx || STATE.musicMood === mood) return;
                stopMusic();
                STATE.musicMood = mood;
                const t = audioCtx.currentTime;
                document.getElementById('music-indicator').textContent = '🎵 ' + mood.toUpperCase();

                switch (mood) {
                    case 'menu':
                        createProceduralTrack([
                            { freq: 261, dur: 0.4, gap: 0.6, type: 'sine' },
                            { freq: 329, dur: 0.4, gap: 0.6, type: 'sine' },
                            { freq: 392, dur: 0.5, gap: 0.5, type: 'triangle' },
                            { freq: 329, dur: 0.3, gap: 0.7, type: 'sine' },
                        ], 1.5);
                        break;
                    case 'action':
                        createProceduralTrack([
                            { freq: 440, dur: 0.2, gap: 0.3, type: 'square' },
                            { freq: 554, dur: 0.2, gap: 0.3, type: 'square' },
                            { freq: 659, dur: 0.25, gap: 0.25, type: 'sawtooth' },
                            { freq: 554, dur: 0.15, gap: 0.35, type: 'square' },
                        ], 1.2);
                        break;
                    case 'fun':
                        createProceduralTrack([
                            { freq: 330, dur: 0.3, gap: 0.5, type: 'triangle' },
                            { freq: 392, dur: 0.3, gap: 0.5, type: 'sine' },
                            { freq: 494, dur: 0.4, gap: 0.4, type: 'triangle' },
                            { freq: 587, dur: 0.2, gap: 0.6, type: 'sine' },
                        ], 1.3);
                        break;
                    case 'intense':
                        createProceduralTrack([
                            { freq: 220, dur: 0.15, gap: 0.2, type: 'sawtooth' },
                            { freq: 277, dur: 0.15, gap: 0.2, type: 'sawtooth' },
                            { freq: 330, dur: 0.2, gap: 0.15, type: 'square' },
                            { freq: 392, dur: 0.15, gap: 0.2, type: 'sawtooth' },
                        ], 0.9);
                        break;
                    default:
                        createProceduralTrack([
                            { freq: 262, dur: 0.5, gap: 0.5, type: 'sine' },
                            { freq: 330, dur: 0.5, gap: 0.5, type: 'sine' },
                        ], 2);
                }
            }

            function createProceduralTrack(notes, tempo) {
                if (!audioCtx || !audioEnabled) return;
                const t = audioCtx.currentTime;
                let offset = 0;
                const loopDuration = notes.reduce((sum, n) => sum + n.dur + n.gap, 0);

                function scheduleLoop() {
                    if (STATE.musicMood === 'stop') return;
                    notes.forEach(note => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = note.type;
                        osc.frequency.setValueAtTime(note.freq, t + offset);
                        gain.gain.setValueAtTime(0.08, t + offset);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + offset + note.dur);
                        osc.connect(gain);
                        gain.connect(musicGain);
                        osc.start(t + offset);
                        osc.stop(t + offset + note.dur);
                        musicNodes.push({ osc, gain });
                        offset += note.dur + note.gap;
                    });
                    setTimeout(scheduleLoop, loopDuration * 1000 / tempo);
                }
                scheduleLoop();
            }

            // ─────────────── CANVAS SETUP ───────────────
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = CONFIG.W;
            canvas.height = CONFIG.H;

            function resizeCanvas() {
                const container = document.getElementById('game-container');
                const rect = container.getBoundingClientRect();
                const scale = Math.min(rect.width / CONFIG.W, rect.height / CONFIG.H);
                canvas.style.width = (CONFIG.W * scale) + 'px';
                canvas.style.height = (CONFIG.H * scale) + 'px';
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // ─────────────── RENDERER ───────────────
            function drawBackground() {
                const gradient = ctx.createLinearGradient(0, 0, 0, CONFIG.GROUND_Y);
                const t = (STATE.dayNight % 2 === 0) ? 0 : 1;
                const skyTop = t === 0 ? '#87CEEB' : '#1a1a3e';
                const skyBot = t === 0 ? '#e0f0ff' : '#2a2a4e';
                gradient.addColorStop(0, skyTop);
                gradient.addColorStop(0.6, skyBot);
                gradient.addColorStop(1, '#f0e6d3');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, CONFIG.W, CONFIG.GROUND_Y);

                // Mountains
                const scrollSlow = STATE.groundScroll * 0.15;
                for (let i = 0; i < 10; i++) {
                    const mx = ((i * 120 - scrollSlow) % (CONFIG.W + 250)) - 125;
                    const mh = 70 + Math.sin(i * 1.5) * 50;
                    ctx.fillStyle = `rgba(${100+i*10},${120+i*8},${140+i*12},0.5)`;
                    ctx.beginPath();
                    ctx.moveTo(mx, CONFIG.GROUND_Y);
                    ctx.lineTo(mx + 60, CONFIG.GROUND_Y - mh);
                    ctx.lineTo(mx + 120, CONFIG.GROUND_Y);
                    ctx.fill();
                }

                // Clouds
                const scrollClouds = STATE.groundScroll * 0.06;
                for (let i = 0; i < 6; i++) {
                    const cx = ((i * 200 - scrollClouds) % (CONFIG.W + 350)) - 175;
                    const cy = 50 + i * 40;
                    ctx.fillStyle = 'rgba(255,255,255,0.7)';
                    ctx.beginPath();
                    ctx.arc(cx, cy, 22, 0, Math.PI * 2);
                    ctx.arc(cx + 28, cy - 8, 18, 0, Math.PI * 2);
                    ctx.arc(cx + 50, cy + 2, 24, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawGround() {
                const y = CONFIG.GROUND_Y;
                const gradient = ctx.createLinearGradient(0, y, 0, CONFIG.H);
                gradient.addColorStop(0, '#c8b99a');
                gradient.addColorStop(0.3, '#a89880');
                gradient.addColorStop(1, '#6b5b4f');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, y, CONFIG.W, CONFIG.H - y);

                ctx.strokeStyle = '#8b7355';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CONFIG.W, y);
                ctx.stroke();

                const offset = STATE.groundScroll % 24;
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                for (let x = -offset; x < CONFIG.W; x += 24) {
                    ctx.fillRect(x, y + 3, 12, 2);
                }
            }

            function drawDino(x, y, ducking, frame, skinIdx, alpha = 1) {
                ctx.save();
                ctx.globalAlpha = alpha;
                const skin = CONFIG.SKINS[skinIdx] || CONFIG.SKINS[0];
                const w = ducking ? 52 : 38;
                const h = ducking ? 30 : 48;
                const baseY = ducking ? y + 18 : y;

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(x, CONFIG.GROUND_Y + 2, w / 2 + 4, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                // Body gradient
                const bodyGrad = ctx.createLinearGradient(x, baseY - h, x, baseY);
                bodyGrad.addColorStop(0, skin.color);
                bodyGrad.addColorStop(1, skin.accent);
                ctx.fillStyle = bodyGrad;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                if (ducking) {
                    ctx.roundRect(x - w / 2, baseY - h, w, h, 8);
                } else {
                    ctx.roundRect(x - w / 2, baseY - h, w, h, 10);
                }
                ctx.fill();
                ctx.stroke();

                // Eye
                const eyeX = x + (ducking ? 15 : 10);
                const eyeY = baseY - (ducking ? 12 : 32);
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(eyeX, eyeY, ducking ? 4 : 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(eyeX + 1.5, eyeY, 2.2, 0, Math.PI * 2);
                ctx.fill();

                // Legs
                ctx.strokeStyle = skin.color;
                ctx.lineWidth = 3.5;
                const legOff = Math.sin(frame * 0.6) * 5;
                if (ducking) {
                    ctx.beginPath();
                    ctx.moveTo(x - 12, baseY + 6);
                    ctx.lineTo(x - 18, baseY + 22);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x + 12, baseY + 6);
                    ctx.lineTo(x + 18, baseY + 22);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(x - 6, baseY);
                    ctx.lineTo(x - 10 + legOff, baseY + 18);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x + 6, baseY);
                    ctx.lineTo(x + 10 - legOff, baseY + 18);
                    ctx.stroke();
                }

                // Arms
                if (!ducking) {
                    ctx.strokeStyle = skin.color;
                    ctx.lineWidth = 3;
                    const armSwing = Math.sin(frame * 0.5) * 4;
                    ctx.beginPath();
                    ctx.moveTo(x - 8, baseY - 22);
                    ctx.lineTo(x - 18 + armSwing, baseY - 8);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x + 8, baseY - 22);
                    ctx.lineTo(x + 18 - armSwing, baseY - 8);
                    ctx.stroke();
                }

                // Skin details
                if (skin.id === 'cool' && !ducking) {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(eyeX - 7, eyeY - 5, 16, 8);
                    ctx.fillStyle = '#333';
                    ctx.fillRect(eyeX - 5, eyeY - 3, 6, 5);
                    ctx.fillRect(eyeX + 3, eyeY - 3, 6, 5);
                } else if (skin.id === 'chad' && !ducking) {
                    ctx.fillStyle = skin.accent;
                    ctx.beginPath();
                    ctx.moveTo(x - 6, baseY - h - 2);
                    ctx.lineTo(x - 3, baseY - h - 10);
                    ctx.lineTo(x, baseY - h - 4);
                    ctx.lineTo(x + 3, baseY - h - 10);
                    ctx.lineTo(x + 6, baseY - h - 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            function drawObstacle(obs) {
                ctx.save();
                if (obs.type === 'cactus') {
                    const h = obs.height || 55;
                    const cx = obs.x;
                    const by = CONFIG.GROUND_Y;
                    const grad = ctx.createLinearGradient(cx, by - h, cx, by);
                    grad.addColorStop(0, '#4a8c3f');
                    grad.addColorStop(1, '#2d5a27');
                    ctx.fillStyle = grad;
                    ctx.strokeStyle = '#1a3a15';
                    ctx.lineWidth = 2;
                    ctx.fillRect(cx - 9, by - h, 18, h);
                    ctx.strokeRect(cx - 9, by - h, 18, h);
                    if (obs.variant >= 1) {
                        ctx.fillRect(cx - 22, by - h * 0.7, 13, 8);
                        ctx.strokeRect(cx - 22, by - h * 0.7, 13, 8);
                    }
                    if (obs.variant >= 2) {
                        ctx.fillRect(cx + 9, by - h * 0.6, 13, 8);
                        ctx.strokeRect(cx + 9, by - h * 0.6, 13, 8);
                    }
                    ctx.fillStyle = '#6aac5f';
                    for (let i = 0; i < 4; i++) {
                        ctx.beginPath();
                        ctx.arc(cx - 5 + (i % 2) * 10, by - h + 8 + i * 10, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (obs.type === 'pterodactyl') {
                    const h = obs.height;
                    const by = CONFIG.GROUND_Y - h;
                    const wingFlap = Math.sin(STATE.frame * 0.35) * 6;
                    ctx.fillStyle = '#555';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(obs.x, by + 16, 18, 9, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#666';
                    ctx.beginPath();
                    ctx.moveTo(obs.x - 6, by + 10);
                    ctx.quadraticCurveTo(obs.x - 20, by - 12 + wingFlap, obs.x - 24, by + 6);
                    ctx.quadraticCurveTo(obs.x - 12, by + 9, obs.x - 6, by + 10);
                    ctx.fill();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 6, by + 10);
                    ctx.quadraticCurveTo(obs.x + 20, by - 12 - wingFlap, obs.x + 24, by + 6);
                    ctx.quadraticCurveTo(obs.x + 12, by + 9, obs.x + 6, by + 10);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#ffa000';
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 14, by + 13);
                    ctx.lineTo(obs.x + 24, by + 15);
                    ctx.lineTo(obs.x + 14, by + 18);
                    ctx.fill();
                }
                ctx.restore();
            }

            function drawPowerup(pu) {
                ctx.save();
                const icons = { jetpack: '🚀', magnet: '🧲', slowmo: '☕', shield: '🛡️', banana: '🍌' };
                const colors = { jetpack: '#ff6d00', magnet: '#f44336', slowmo: '#9c27b0', shield: '#4fc3f7',
                    banana: '#ffeb3b' };
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = colors[pu.subtype] || '#000';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(pu.x - 18, pu.y - 18, 36, 36, 10);
                ctx.fill();
                ctx.stroke();
                ctx.shadowColor = colors[pu.subtype];
                ctx.shadowBlur = 15;
                ctx.font = '22px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(icons[pu.subtype] || '?', pu.x, pu.y);
                ctx.shadowBlur = 0;
                ctx.restore();
            }

            function drawBone(b) {
                ctx.save();
                ctx.fillStyle = '#f5f5dc';
                ctx.strokeStyle = '#8b7355';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(b.x - 12, b.y - 5, 24, 10, 5);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#e8dcc8';
                ctx.beginPath();
                ctx.arc(b.x - 10, b.y - 6, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(b.x + 10, b.y + 6, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            function drawHUD() {

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px "Segoe UI", sans-serif';

                ctx.fillText(`Score: ${Math.floor(STATE.score)}`, CONFIG.W - 20, 32);
                ctx.fillText(`HI: ${Math.floor(STATE.highScore)}`, CONFIG.W - 20, 54);

                if (STATE.gameMode === 'local2p') {
                    ctx.textAlign = 'left';
                    ctx.fillStyle = '#e74c3c';

            function drawAIPlayers() {
                aiPlayers.forEach((ai, i) => {
                    if (ai.dead && ai.respawnTimer > 0) return;
                    ctx.save();
                    ctx.globalAlpha = ai.dead ? 0.3 : 0.7;
                    drawDino(ai.x, ai.y, false, STATE.frame, ai.skin || 0, ctx.globalAlpha);
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(ai.name, ai.x, ai.y - 58);
                    if (ai.tauntTimer > 0) {
                        ctx.fillStyle = 'rgba(255,255,255,0.9)';

                        ctx.fillRect(ai.x - tw / 2, ai.y - 78, tw, 22);
                        ctx.fillStyle = '#333';

                });

            function drawParticles() {
                [...particles, ...dustParticles, ...exhaustParticles].forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life / p.maxLife;
                    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);

            function spawnObstacle() {
                const lastObs = obstacles.reduce((max, o) => Math.max(max, o.x), 0);
                const minGap = CONFIG.OBSTACLE_MIN_GAP;
                if (lastObs < CONFIG.W - minGap - Math.random() * 200) {
                    if (Math.random() < 0.55) {
                        obstacles.push({
                            x: CONFIG.W + 40,
                            type: 'cactus',
                            variant: Math.floor(Math.random() * 3),
                            height: 45 + Math.floor(Math.random() * 30),
                            width: 18,
                        });
                    } else {
                        obstacles.push({
                            x: CONFIG.W + 40,
                            type: 'pterodactyl',
                            height: 50 + Math.floor(Math.random() * 60),
                            width: 44,
                        });
                    }
                }
            }

            function spawnPowerup() {
                const types = ['jetpack', 'magnet', 'slowmo', 'shield', 'banana'];
                powerups.push({
                    x: CONFIG.W + 40,
                    y: CONFIG.GROUND_Y - 45,
                    subtype: types[Math.floor(Math.random() * types.length)],
                });
            }

            function spawnBone() { bones.push({ x: CONFIG.W + 40, y: CONFIG.GROUND_Y - 12 }); }

            function checkCollision(px, py, pw, ph, ox, oy, ow, oh) {
                const m = 8;
                return px - pw / 2 + m < ox + ow / 2 && px + pw / 2 - m > ox - ow / 2 &&
                    py - ph + m < oy && py - m > oy - oh;
            }

            function handleCollision(playerObj) {
                const p = playerObj;
                const w = p.ducking ? 52 : 38;
                const h = p.ducking ? 30 : 48;
                const baseY = p.ducking ? p.y + 18 : p.y;
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const o = obstacles[i];
                    const oh = o.type === 'pterodactyl' ? o.height : (o.height || 45);
                    const ow = o.width || 18;
                    if (checkCollision(p.x, baseY, w, h, o.x, CONFIG.GROUND_Y, ow, oh)) {
                        if (p.shield && p.shieldHits < p.shieldMax) {
                            p.shieldHits++;
                            STATE.shieldHitsTotal++;
                            sfxShieldBreak();
                            if (p.shieldHits >= p.shieldMax) { p.shield = false;
                                p.shieldHits = 0; }
                            obstacles.splice(i, 1);
                            for (let j = 0; j < 15; j++) particles.push({ x: o.x, y: CONFIG.GROUND_Y - oh / 2,
                                vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5 - 2, life: 20,
                                maxLife: 35, color: '#4fc3f7', size: 3 + Math.random() * 3 });
                            return false;
                        }
                        if (p.jetpack && p.y < CONFIG.GROUND_Y - 40) continue;
                        return true;
                    }
                }
                return false;
            }

            function updatePlayer(p, isP2 = false) {
                if (p.dead) return;
                if (p.inputLag > 0) {
                    p.inputLag--;
                    if (p.queuedJump) { p.queuedJump = false;
                        doJump(p); }
                    if (p.queuedDuck) { p.queuedDuck = false;
                        p.ducking = true; }
                }
                if (p.jetpack && p.powerupTimer > 0) {
                    p.y = Math.max(CONFIG.GROUND_Y - 140, p.y - 2.8);
                    p.vy = Math.min(p.vy, 0);
                    p.jumping = true;
                    if (Math.random() < 0.5) exhaustParticles.push({ x: p.x - 4 + Math.random() * 8, y: p.y + 10,
                        vx: (Math.random() - 0.5) * 0.5, vy: -1 - Math.random() * 3, life: 12, maxLife: 20,
                        color: Math.random() < 0.5 ? '#ff6d00' : '#ffab00', size: 2 + Math.random() * 3 });
                }
                if (!p.jetpack || p.powerupTimer <= 0) {
                    p.vy += CONFIG.GRAVITY;
                    p.y += p.vy;
                }
                const groundY = isP2 ? CONFIG.GROUND_Y - 50 : CONFIG.GROUND_Y;
                if (p.y >= groundY) { p.y = groundY;
                    p.vy = 0;
                    p.jumping = false;
                    p.doubleJumped = false; }
                if (p.ducking && p.y >= groundY) p.ducking = true;
                else if (p.jumping) p.ducking = false;
                if (p.banana && p.slipCooldown <= 0 && p.jumping && Math.random() < p.slipChance) {
                    p.slipCooldown = 25;
                    p.x += (Math.random() - 0.5) * 50;
                    p.x = Math.max(30, Math.min(CONFIG.W - 60, p.x));
                }
                if (p.slipCooldown > 0) p.slipCooldown--;
                p.animTimer++;
                if (p.animTimer > 7) { p.animTimer = 0;
                    p.animFrame = (p.animFrame + 1) % 2; }
                if (p.y >= groundY - 2 && !p.ducking && Math.random() < 0.4) {
                    dustParticles.push({ x: p.x - 8 + Math.random() * 16, y: groundY + 2, vx: -STATE.speed * 0.3,
                        vy: -Math.random() * 2, life: 12, maxLife: 20, size: 2 + Math.random() * 3,
                    color: '#c0b090' });
                }
                if (p.powerupTimer > 0) {
                    p.powerupTimer--;
                    if (p.powerupTimer <= 0) {
                        p.powerup = null;
                        p.jetpack = false;
                        p.magnet = false;
                        p.slowmo = false;
                        p.banana = false;
                        p.slipChance = 0;
                        p.inputLag = 0;
                    }
                }
            }

            function doJump(p) {
                initAudio();
                const jumpMultiplier = 1 + (STATE.upgradeLevels['jumpHeight'] || 0) * 0.15;
                if (!p.jumping) {
                    p.vy = CONFIG.JUMP_FORCE * jumpMultiplier;
                    p.jumping = true;
                    p.doubleJumped = false;
                    p.ducking = false;
                    sfxJump();
                } else if (!p.doubleJumped) {
                    p.vy = CONFIG.DOUBLE_JUMP_FORCE * jumpMultiplier;
                    p.doubleJumped = true;
                    sfxDoubleJump();
                    for (let i = 0; i < 6; i++) particles.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 3,
                        vy: Math.random() * 3, life: 10, maxLife: 18, color: '#fff', size: 2 });
                }
            }

            function updateAI() {
                aiPlayers.forEach(ai => {
                    if (ai.dead) {
                        ai.respawnTimer--;
                        if (ai.respawnTimer <= 0) {
                            ai.dead = false;
                            ai.x = CONFIG.DINO_X + 80 + Math.random() * 200;
                            ai.y = CONFIG.GROUND_Y;
                        }
                        return;
                    }
                    ai.score += CONFIG.SCORE_PER_FRAME * 0.8;
                    ai.x += STATE.speed * (0.7 + ai.reactionTime / 60);
                    const nearest = obstacles.find(o => o.x > ai.x - 50 && o.x < ai.x + 100);
                    if (nearest && nearest.x - ai.x < 50 + ai.reactionTime) {
                        if (Math.random() < ai.jumpAccuracy) {
                            ai.vy = CONFIG.JUMP_FORCE * 0.9;
                            ai.jumping = true;
                        }
                    }
                    ai.vy += CONFIG.GRAVITY;
                    ai.y += ai.vy;
                    if (ai.y >= CONFIG.GROUND_Y) { ai.y = CONFIG.GROUND_Y;
                        ai.vy = 0;
                        ai.jumping = false; }
                    // AI death check
                    const aiW = 38,
                        aiH = 48;
                    for (let o of obstacles) {
                        const oh = o.type === 'pterodactyl' ? o.height : (o.height || 45);
                        const ow = o.width || 18;
                        if (checkCollision(ai.x, ai.y - aiH / 2, aiW, aiH, o.x, CONFIG.GROUND_Y, ow, oh)) {
                            ai.dead = true;
                            ai.respawnTimer = 150 + Math.random() * 100;
                            ai.taunt = ['Ouch!', 'Lucky!', '...'][Math.floor(Math.random() * 3)];
                            ai.tauntTimer = 60;
                            break;
                        }
                    }
                    if (ai.tauntTimer > 0) ai.tauntTimer--;
                    if (Math.random() < 0.003 && ai.tauntTimer <= 0) {
                        ai.taunt = ['Nice!', 'Run!', 'Haha!', 'Go!'][Math.floor(Math.random() * 4)];
                        ai.tauntTimer = 90;
                    }
                });
            }

            function applyPowerup(playerObj, subtype) {
                const p = playerObj;
                p.powerup = subtype;
                p.powerupTimer = CONFIG.POWERUP_DURATION;
                p.jetpack = false;
                p.magnet = false;
                p.slowmo = false;
                p.banana = false;
                p.slipChance = 0;
                p.inputLag = 0;
                switch (subtype) {
                    case 'jetpack':
                        p.jetpack = true;
                        break;
                    case 'magnet':
                        p.magnet = true;
                        break;
                    case 'slowmo':
                        p.slowmo = true;
                        p.inputLag = 2;
                        break;
                    case 'shield':
                        p.shield = true;
                        p.shieldMax = 1 + (STATE.upgradeLevels['ironScales'] || 0);
                        p.shieldHits = 0;
                        break;
                    case 'banana':
                        p.banana = true;
                        p.slipChance = 0.25;
                        break;
                }
                sfxPowerup();
                for (let i = 0; i < 12; i++) particles.push({ x: p.x, y: p.y - 20, vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4 - 2, life: 15, maxLife: 25, color: '#fff', size: 2 + Math.random() *
                    3 });
            }

            function updateEvents() {
                if (STATE.eventTimer > 0) {
                    STATE.eventTimer--;
                    if (STATE.eventTimer <= 0) {
                        STATE.activeEvent = null;
                        STATE.eventCooldown = 300 + Math.random() * 400;
                    }
                }
                if (!STATE.activeEvent && STATE.eventCooldown > 0) STATE.eventCooldown--;
                if (!STATE.activeEvent && STATE.eventCooldown <= 0 && STATE.running && STATE.score > 50) {
                    const events = ['chickenInvasion', 'raveMode', 'taxCollection', 'gravityGlitch'];
                    STATE.activeEvent = events[Math.floor(Math.random() * events.length)];
                    STATE.eventTimer = 250;
                }
                if (STATE.activeEvent === 'raveMode' && STATE.frame % 6 === 0) playTone(80 + Math.random() * 200, 0.1,
                    'sawtooth', 0.1);
                if (STATE.activeEvent === 'taxCollection' && STATE.eventTimer === 240) STATE.score *= 0.9;
            }

            function checkUnlocks() {
                if (STATE.score >= 800 && !STATE.skinUnlocks['cool']) {
                    STATE.skinUnlocks['cool'] = true;
                    CONFIG.SKINS.find(s => s.id === 'cool').unlock = true;
                }
                const alives = aiPlayers.filter(a => !a.dead).length;
                if (alives === 0 && aiPlayers.length === 3 && !STATE.skinUnlocks['corporate']) {
                    STATE.skinUnlocks['corporate'] = true;
                    CONFIG.SKINS.find(s => s.id === 'corporate').unlock = true;
                }
                if (STATE.shieldHitsTotal >= 5 && !STATE.skinUnlocks['cactus']) {
                    STATE.skinUnlocks['cactus'] = true;
                    CONFIG.SKINS.find(s => s.id === 'cactus').unlock = true;
                }
                if (!PLAYER.powerup && STATE.score >= 400 && !STATE.skinUnlocks['ninja']) {
                    STATE.skinUnlocks['ninja'] = true;
                    CONFIG.SKINS.find(s => s.id === 'ninja').unlock = true;
                }
                saveState();
            }

                const data = {
                    highScore: STATE.highScore,
                    bones: STATE.bones,
                    skinUnlocks: STATE.skinUnlocks,
                    upgradeLevels: STATE.upgradeLevels,
                    currentSkin: STATE.currentSkin,

                    dailyScore: STATE.dailyScore,
                    leaderboard: STATE.leaderboard,

            function loadState() {
                const saved = JSON.parse(localStorage.getItem('dinoRunnerEnhanced') || '{}');
                STATE.highScore = saved.highScore || 0;
                STATE.bones = saved.bones || 0;
                STATE.skinUnlocks = saved.skinUnlocks || { classic: true };
                STATE.upgradeLevels = saved.upgradeLevels || {};
                STATE.currentSkin = saved.currentSkin || 0;
                STATE.aiBeatCount = saved.aiBeatCount || 0;
                STATE.shieldHitsTotal = saved.shieldHitsTotal || 0;
                STATE.dailyScore = saved.dailyScore || { date: '', score: 0 };

            function createOnlineRoom() {

                onlinePlayerId = 'host_' + Date.now();
                onlineRef.child(code).set({
                    code,
                    hostId: onlinePlayerId,
                    players: { [onlinePlayerId]: { x: CONFIG.DINO_X, y: CONFIG.GROUND_Y, score: 0, dead: false,
                            skin: STATE.currentSkin, name: 'Host' } },
                    status: 'waiting',
                }).then(() => {
                    onlineRoom = code;
                    STATE.gameMode = 'online';
                    STATE.screen = 'playing';
                    STATE.running = true;
                    resetGame();
                    listenOnlineRoom(code);
                    alert(`Room created! Code: ${code}`);
                });

            function joinPublicRoom() {
                if (!firebaseReady) return alert('Firebase not connected');
                onlineRef.once('value').then(snap => {
                    const rooms = snap.val();
                    if (!rooms) return alert('No rooms available. Create one!');
                    const available = Object.entries(rooms).find(([c, d]) => d.status === 'waiting' && Object
                        .keys(d.players || {}).length < 4);
                    if (!available) return alert('No available rooms. Create one!');
                    onlinePlayerId = 'player_' + Date.now();
                    onlineRoom = available[0];
                    onlineRef.child(onlineRoom + '/players/' + onlinePlayerId).set({
                        x: CONFIG.DINO_X,
                        y: CONFIG.GROUND_Y,
                        score: 0,
                        dead: false,
                        skin: STATE.currentSkin,
                        name: 'Player'
                    }).then(() => {
                        STATE.gameMode = 'online';
                        STATE.screen = 'playing';
                        STATE.running = true;
                        resetGame();
                        listenOnlineRoom(onlineRoom);
                    });
                });
            }

            function listenOnlineRoom(code) {
                onlineRef.child(code).on('value', snap => {
                    const data = snap.val();
                    if (!data) return;
                    onlinePlayers = data.players || {};
                    if (data.status === 'playing' && STATE.screen !== 'playing') {
                        STATE.screen = 'playing';
                        STATE.running = true;
                        resetGame();
                    }
                });
            }

            function syncOnline() {
                if (!onlineRoom || !onlinePlayerId || !firebaseReady) return;
                onlineRef.child(onlineRoom + '/players/' + onlinePlayerId).update({
                    x: PLAYER.x,
                    y: PLAYER.y,
                    score: Math.floor(STATE.score),
                    dead: STATE.dead,
                    skin: STATE.currentSkin,
                }).catch(() => {});
                if (STATE.dead && Object.values(onlinePlayers).every(p => p.dead)) {
                    onlineRef.child(onlineRoom + '/status').set('finished').catch(() => {});
                }
            }

                    ctx.save();
                    ctx.globalAlpha = 0.7;
                    drawDino(data.x || CONFIG.DINO_X, data.y || CONFIG.GROUND_Y, false, STATE.frame, data.skin ||
                        0, 0.7);
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(data.name || 'Player', data.x || CONFIG.DINO_X, (data.y || CONFIG.GROUND_Y) - 55);
                    ctx.restore();
                });
            }

            // ─────────────── MENU SYSTEM ───────────────
            function drawMenu() {
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);
                drawBackground();
                drawGround();
                STATE.groundScroll += 2;
                STATE.frame++;

                drawDino(CONFIG.DINO_X, CONFIG.GROUND_Y, false, Math.floor(STATE.frame / 8) % 2, STATE.currentSkin);

                // Title
                const titleGrad = ctx.createLinearGradient(0, 60, 0, 110);
                titleGrad.addColorStop(0, '#ffd700');
                titleGrad.addColorStop(1, '#ff6b6b');
                ctx.fillStyle = titleGrad;
                ctx.font = 'bold 42px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🦖 DINO RUNNER+', CONFIG.W / 2, 90);
                ctx.fillStyle = '#fff';
                ctx.font = '14px sans-serif';
                ctx.fillText('Enhanced Edition', CONFIG.W / 2, 115);

                const btns = [
                    { label: '▶  PLAY SOLO', y: 170, action: 'startSingle' },
                    { label: '👥  2 PLAYERS', y: 215, action: 'startLocal2P' },
                    { label: '🌐  ONLINE ROOM', y: 260, action: 'createRoom' },
                    { label: '🔍  JOIN PUBLIC', y: 305, action: 'joinPublic' },
                    { label: '⬆  UPGRADES', y: 350, action: 'upgradesMenu' },
                    { label: '🎨  SKINS', y: 395, action: 'skinsMenu' },
                    { label: '🏆  LEADERBOARD', y: 440, action: 'leaderboardMenu' },
                ];

                btns.forEach(btn => {
                    const bx = CONFIG.W / 2 - 160;
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.roundRect(bx, btn.y - 16, 320, 38, 20);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 16px "Segoe UI", sans-serif';
                    ctx.fillText(btn.label, CONFIG.W / 2, btn.y + 8);
                });

                ctx.fillStyle = '#aaa';
                ctx.font = '13px sans-serif';
                ctx.fillText(`HS: ${Math.floor(STATE.highScore)} | 🦴 ${STATE.bones}`, CONFIG.W / 2, 490);
                ctx.fillText('SPACE or Tap to Start | ESC for Menu', CONFIG.W / 2, 515);
            }

            function drawSubMenu(title, contentCallback) {
                ctx.fillStyle = 'rgba(10,10,30,0.95)';
                ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 28px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(title, CONFIG.W / 2, 40);
                ctx.font = '13px sans-serif';
                ctx.fillText('ESC to go back', CONFIG.W / 2, 65);
                contentCallback();
            }

            function handleClick(mx, my) {
                if (STATE.screen === 'menu') {
                    const btns = [
                        { y: 170, action: 'startSingle' }, { y: 215, action: 'startLocal2P' },
                        { y: 260, action: 'createRoom' }, { y: 305, action: 'joinPublic' },
                        { y: 350, action: 'upgradesMenu' }, { y: 395, action: 'skinsMenu' },
                        { y: 440, action: 'leaderboardMenu' },
                    ];
                    const bx = CONFIG.W / 2 - 160;
                    btns.forEach(b => {
                        if (mx >= bx && mx <= bx + 320 && my >= b.y - 16 && my <= b.y + 22) handleAction(b
                        .action);
                    });
                } else if (STATE.screen === 'upgradesMenu') {
                    CONFIG.UPGRADES.forEach((u, i) => {
                        const y = 100 + i * 80;
                        if (mx >= CONFIG.W - 200 && mx <= CONFIG.W - 40 && my >= y + 10 && my <= y + 50)
                            buyUpgrade(u.id);
                    });
                } else if (STATE.screen === 'skinsMenu') {
                    CONFIG.SKINS.forEach((s, i) => {
                        const x = 70 + (i % 3) * 290;
                        const y = 100 + Math.floor(i / 3) * 180;
                        if (mx >= x && mx <= x + 240 && my >= y && my <= y + 150 && s.unlock) {
                            STATE.currentSkin = i;
                            saveState();
                            sfxClick();
                        }
                    });
                }
            }

            function handleAction(action) {
                initAudio();
                sfxClick();
                switch (action) {
                    case 'startSingle':
                        STATE.gameMode = 'single';
                        STATE.screen = 'playing';
                        STATE.running = true;
                        resetGame();
                        playMusicMood('action');
                        break;
                    case 'startLocal2P':
                        STATE.gameMode = 'local2p';
                        STATE.screen = 'playing';
                        STATE.running = true;
                        resetGame();
                        playMusicMood('action');
                        break;
                    case 'createRoom':
                        createOnlineRoom();
                        break;
                    case 'joinPublic':
                        joinPublicRoom();
                        break;
                    case 'upgradesMenu':
                        STATE.screen = 'upgradesMenu';
                        break;
                    case 'skinsMenu':
                        STATE.screen = 'skinsMenu';
                        break;
                    case 'leaderboardMenu':
                        STATE.screen = 'leaderboardMenu';
                        break;
                }
            }

            function buyUpgrade(id) {
                const lvl = STATE.upgradeLevels[id] || 0;
                if (lvl >= 3) return;
                const cost = CONFIG.UPGRADES.find(u => u.id === id).costs[lvl];
                if (STATE.bones >= cost) { STATE.bones -= cost;
                    STATE.upgradeLevels[id] = lvl + 1;
                    sfxPickup();
                    saveState(); } else sfxDeath();
            }

            function drawUpgradesMenu() {
                drawSubMenu('UPGRADES', () => {
                    ctx.fillText(`🦴 ${STATE.bones} bones`, CONFIG.W / 2, 85);
                    CONFIG.UPGRADES.forEach((u, i) => {
                        const lvl = STATE.upgradeLevels[u.id] || 0;
                        const y = 110 + i * 80;
                        ctx.fillStyle = 'rgba(255,255,255,0.08)';
                        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                        ctx.beginPath();
                        ctx.roundRect(30, y - 5, CONFIG.W - 60, 60, 10);
                        ctx.fill();
                        ctx.stroke();
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 15px sans-serif';
                        ctx.textAlign = 'left';
                        ctx.fillText(`${u.icon} ${u.name}`, 50, y + 15);
                        ctx.font = '11px sans-serif';
                        ctx.fillText(`Lvl ${lvl}/3: ${u.effect[lvl] || 'MAXED'}`, 50, y + 35);
                        if (lvl < 3) {
                            ctx.fillStyle = STATE.bones >= u.costs[lvl] ? '#4caf50' : '#f44336';
                            ctx.textAlign = 'right';
                            ctx.fillText(`Buy: ${u.costs[lvl]} 🦴`, CONFIG.W - 60, y + 25);
                        } else {
                            ctx.fillStyle = '#ffd700';
                            ctx.textAlign = 'right';
                            ctx.fillText('✓ MAX', CONFIG.W - 60, y + 25);
                        }
                    });
                });
            }

            function drawSkinsMenu() {
                drawSubMenu('SKINS', () => {
                    CONFIG.SKINS.forEach((s, i) => {
                        const x = 70 + (i % 3) * 290;
                        const y = 100 + Math.floor(i / 3) * 180;
                        ctx.fillStyle = STATE.currentSkin === i ? 'rgba(255,215,0,0.2)' : 'rgba(255,255,255,0.05)';
                        ctx.strokeStyle = STATE.currentSkin === i ? '#ffd700' : 'rgba(255,255,255,0.3)';
                        ctx.lineWidth = STATE.currentSkin === i ? 3 : 1;
                        ctx.beginPath();
                        ctx.roundRect(x, y, 240, 150, 12);
                        ctx.fill();
                        ctx.stroke();
                        drawDino(x + 100, y + 100, false, 0, i);
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 13px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(s.name, x + 120, y + 22);
                        ctx.font = '10px sans-serif';
                        ctx.fillStyle = s.unlock ? '#4caf50' : '#f44336';
                        ctx.fillText(s.unlock ? '✓ Unlocked' : '🔒 ' + s.req, x + 120, y + 40);
                        if (STATE.currentSkin === i) ctx.fillText('★ EQUIPPED', x + 120, y + 58);
                    });
                });
            }

            // ─────────────── INPUT ───────────────
            document.addEventListener('keydown', e => {
                initAudio();
                const k = e.key.toLowerCase();
                if (k === ' ' || k === 'spacebar') { e.preventDefault();
                    INPUT.space = true; if (STATE.screen === 'menu') handleAction('startSingle'); if (STATE
                        .screen === 'gameover') restartGame(); }
                if (k === 'arrowdown') { e.preventDefault();
                    INPUT.down = true; }
                if (k === 'w') { e.preventDefault();
                    INPUT.w = true; }
                if (k === 's') { e.preventDefault();
                    INPUT.s = true; }
                if (k === 'escape') {
                    e.preventDefault();
                    if (STATE.screen === 'playing') { STATE.running = false;
                        STATE.screen = 'menu';
                        playMusicMood('menu'); if (onlineRoom) { onlineRef.child(onlineRoom).remove()
                            .catch(() => {});
                            onlineRoom = null; } } else STATE.screen = 'menu';
                    playMusicMood('menu');
                }
            });
            document.addEventListener('keyup', e => {
                const k = e.key.toLowerCase();
                if (k === ' ' || k === 'spacebar') INPUT.space = false;
                if (k === 'arrowdown') INPUT.down = false;
                if (k === 'w') INPUT.w = false;
                if (k === 's') INPUT.s = false;
            });

            canvas.addEventListener('click', e => {
                initAudio();
                const rect = canvas.getBoundingClientRect();
                const mx = (e.clientX - rect.left) * CONFIG.W / rect.width;
                const my = (e.clientY - rect.top) * CONFIG.H / rect.height;
                if (STATE.screen === 'menu' || STATE.screen === 'upgradesMenu' || STATE.screen === 'skinsMenu')
                    handleClick(mx, my);
                if (STATE.screen === 'gameover') restartGame();
                if (STATE.screen === 'playing' && STATE.running && !STATE.dead) { INPUT.touchJump = true;
                    setTimeout(() => INPUT.touchJump = false, 80); }
            });

            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                initAudio();
                INPUT.touchJump = true;
                if (STATE.screen === 'menu') handleAction('startSingle');
                if (STATE.screen === 'gameover') restartGame();
                setTimeout(() => INPUT.touchJump = false, 80);
            }, { passive: false });
            canvas.addEventListener('touchend', e => { e.preventDefault();
                INPUT.touchJump = false;
                INPUT.touchDuck = false; }, { passive: false });

            document.getElementById('btn-jump')?.addEventListener('pointerdown', e => { e.preventDefault();
                initAudio();
                INPUT.touchJump = true; if (STATE.screen === 'menu') handleAction('startSingle'); if (STATE
                    .screen === 'gameover') restartGame(); });
            document.getElementById('btn-jump')?.addEventListener('pointerup', e => { e.preventDefault();
                INPUT.touchJump = false; });
            document.getElementById('btn-duck')?.addEventListener('pointerdown', e => { e.preventDefault();
                INPUT.touchDuck = true; });
            document.getElementById('btn-duck')?.addEventListener('pointerup', e => { e.preventDefault();
                INPUT.touchDuck = false; });

            function restartGame() {
                STATE.screen = 'playing';
                STATE.running = true;
                resetGame();
                playMusicMood('action');
            }

            // ─────────────── MAIN LOOP ───────────────
            function update() {
                if (STATE.screen !== 'playing' || !STATE.running || STATE.dead) return;
                STATE.frame++;
                const effSpeed = (PLAYER.slowmo || PLAYER2.slowmo) ? STATE.speed * CONFIG.SLOWMO_FACTOR : STATE.speed;

                STATE.score += CONFIG.SCORE_PER_FRAME * (effSpeed / CONFIG.INITIAL_SPEED);
                if (Math.floor(STATE.score) % 100 === 0 && STATE.score > 0 &&
                    Math.floor(STATE.score) !== Math.floor(STATE.score - CONFIG.SCORE_PER_FRAME)) sfxMilestone();

                const maxSpeed = CONFIG.MAX_SPEED * (1 - (STATE.upgradeLevels['speedControl'] || 0) * 0.08);
                if (STATE.speed < maxSpeed && Math.floor(STATE.score) % 100 === 0) STATE.speed = Math.min(maxSpeed, STATE
                    .speed + CONFIG.SPEED_INCREMENT);

                STATE.dayNight = Math.floor(STATE.score / 300);
                STATE.groundScroll += effSpeed;

                updatePlayer(PLAYER);
                if (STATE.gameMode === 'local2p' && !PLAYER2.dead) { updatePlayer(PLAYER2, true);
                    PLAYER2.score += CONFIG.SCORE_PER_FRAME; }

                // Input handling
                if ((INPUT.space || INPUT.touchJump) && !STATE.dead) { if (PLAYER.inputLag > 0) PLAYER.queuedJump =
                        true;
                    else doJump(PLAYER);
                    INPUT.space = false;
                    INPUT.touchJump = false; }
                PLAYER.ducking = INPUT.down || INPUT.touchDuck;
                if (STATE.gameMode === 'local2p' && !PLAYER2.dead) { if (INPUT.w) { if (PLAYER2.inputLag > 0) PLAYER2
                            .queuedJump = true;
                        else doJump(PLAYER2);
                        INPUT.w = false; }
                    PLAYER2.ducking = INPUT.s; }

                // Move objects
                obstacles.forEach(o => o.x -= effSpeed);
                obstacles = obstacles.filter(o => o.x > -60);
                powerups.forEach(p => p.x -= effSpeed);
                powerups = powerups.filter(p => p.x > -40);
                bones.forEach(b => b.x -= effSpeed);
                bones = bones.filter(b => b.x > -40);

                spawnObstacle();
                if (Math.random() < CONFIG.POWERUP_CHANCE * (1 + (STATE.upgradeLevels['luckyPaws'] || 0) * 0.2) && powerups
                    .length < 3) spawnPowerup();
                if (Math.random() < CONFIG.BONE_CHANCE && bones.length < 6) spawnBone();

                // Collisions
                if (handleCollision(PLAYER)) {
                    STATE.dead = true;
                    STATE.shakeTimer = 18;
                    STATE.shakeIntensity = 10;
                    sfxDeath();
                    for (let i = 0; i < 25; i++) particles.push({ x: PLAYER.x, y: PLAYER.y - 20, vx: (Math.random() -
                            0.5) * 7, vy: (Math.random() - 0.5) * 7 - 3, life: 25, maxLife: 40, color: '#333',
                        size: 3 + Math.random() * 5 });
                    if (STATE.score > STATE.highScore) STATE.highScore = Math.floor(STATE.score);
                    updateLeaderboard('');
                    saveState();
                    STATE.screen = 'gameover';
                    STATE.running = false;
                    playMusicMood('menu');
                    return;
                }
                if (STATE.gameMode === 'local2p' && !PLAYER2.dead && handleCollision(PLAYER2)) {
                    PLAYER2.dead = true;
                    sfxDeath();
                }

                // Powerup collection
                powerups.forEach((pu, i) => {
                    if (Math.abs(PLAYER.x - pu.x) < 26 && Math.abs(PLAYER.y - 20 - pu.y) < 26) {
                        applyPowerup(PLAYER, pu.subtype);
                        powerups.splice(i, 1);
                    }
                    if (STATE.gameMode === 'local2p' && !PLAYER2.dead && Math.abs(PLAYER2.x - pu.x) < 26 && Math
                        .abs(PLAYER2.y - 20 - pu.y) < 26) {
                        applyPowerup(PLAYER2, pu.subtype);
                        powerups.splice(i, 1);
                    }
                });

                // Bone collection
                bones.forEach((b, i) => {
                    if (Math.abs(PLAYER.x - b.x) < (PLAYER.magnet ? 100 : 24) && Math.abs(PLAYER.y - b.y) < 24) {
                        if (PLAYER.magnet) { b.x += (PLAYER.x - b.x) * 0.2;
                            b.y += (PLAYER.y - b.y) * 0.2; }
                        if (Math.abs(PLAYER.x - b.x) < 24) { STATE.bones++;
                            sfxBone();
                            bones.splice(i, 1); }
                    }
                });

                updateAI();
                updateEvents();
                checkUnlocks();

                // Particles
                particles = particles.filter(p => { p.x += p.vx;
                    p.y += p.vy;
                    p.life--; return p.life > 0; });
                dustParticles = dustParticles.filter(p => { p.x += p.vx;
                    p.y += p.vy;
                    p.life--; return p.life > 0; });
                exhaustParticles = exhaustParticles.filter(p => { p.x += p.vx;
                    p.y += p.vy;
                    p.life--; return p.life > 0; });

                if (STATE.shakeTimer > 0) STATE.shakeTimer--;
                if (STATE.frame % 15 === 0 && STATE.running) syncOnline();
                if (STATE.score > 100 && STATE.musicMood !== 'intense') playMusicMood('intense');
            }

            function render() {
                ctx.clearRect(0, 0, CONFIG.W, CONFIG.H);
                if (STATE.screen === 'menu') { drawMenu(); return; }
                if (STATE.screen === 'upgradesMenu') { drawUpgradesMenu(); return; }
                if (STATE.screen === 'skinsMenu') { drawSkinsMenu(); return; }
                if (STATE.screen === 'leaderboardMenu') {
                    drawSubMenu('LEADERBOARD', () => {
                        STATE.leaderboard.forEach((e, i) => {
                            ctx.fillStyle = '#fff';
                            ctx.font = '14px sans-serif';
                            ctx.textAlign = 'left';
                            ctx.fillText(`${i+1}. ${e.name} - ${e.score} (${e.skin})`, 100, 110 + i * 35);
                        });
                    });
                    return;
                }

                // Playing
                ctx.save();
                if (STATE.shakeTimer > 0) ctx.setTransform(1, 0, 0, 1, (Math.random() - 0.5) * STATE.shakeIntensity, (Math
                    .random() - 0.5) * STATE.shakeIntensity);
                drawBackground();
                if (STATE.activeEvent === 'raveMode' && STATE.frame % 3 < 1) { ctx.fillStyle =
                        'rgba(255,0,255,0.06)';
                    ctx.fillRect(0, 0, CONFIG.W, CONFIG.H); }
                drawGround();
                obstacles.forEach(o => drawObstacle(o));
                bones.forEach(b => drawBone(b));
                powerups.forEach(p => drawPowerup(p));
                drawAIPlayers();
                drawOnlinePlayers();
                if (!STATE.dead) {
                    if (PLAYER.shield) { ctx.strokeStyle = '#4fc3f7';
                        ctx.lineWidth = 3;
                        ctx.shadowColor = '#4fc3f7';
                        ctx.shadowBlur = 12;
                        ctx.beginPath();
                        ctx.arc(PLAYER.x, PLAYER.y - 24, 30, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.shadowBlur = 0; }
                    drawDino(PLAYER.x, PLAYER.y, PLAYER.ducking, PLAYER.animFrame, STATE.currentSkin);
                }
                if (STATE.gameMode === 'local2p' && !PLAYER2.dead) drawDino(PLAYER2.x, PLAYER2.y, PLAYER2.ducking,
                    PLAYER2.animFrame, 2);
                drawParticles();
                drawHUD();
                if (STATE.screen === 'gameover') {
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 32px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('GAME OVER', CONFIG.W / 2, CONFIG.H / 2 - 30);
                    ctx.fillText(`Score: ${Math.floor(STATE.score)}`, CONFIG.W / 2, CONFIG.H / 2 + 15);
                }
                ctx.restore();
            }

            function gameLoop() {
                update();
                render();
                requestAnimationFrame(gameLoop);
            }

            // ─────────────── INIT ───────────────
            function init() {
                loadState();
                initFirebase();
                initAudio();
                resizeCanvas();
                STATE.screen = 'menu';
                playMusicMood('menu');
                document.getElementById('music-indicator').textContent = '🎵 MENU';
                gameLoop();
            }
            init();
        })();
    </script>
</body>
</html>
