            function createOnlineRoom() {
                if (!firebaseReady) {
                    alert('Firebase not connected. Online mode unavailable.');
                    return;
                }
                const roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                onlinePlayerId = 'host_' + Date.now();
                const roomData = {
                    code: roomCode,
                    hostId: onlinePlayerId,
                    players: {
                        [onlinePlayerId]: { x: CONFIG.DINO_X, y: CONFIG.GROUND_Y, score: 0, isDead: false,
                            skin: STATE.currentSkin, name: 'Host' }
                    },
                    status: 'waiting',
                    createdAt: firebase.database.ServerValue.TIMESTAMP,
                };
                onlineRef.child(roomCode).set(roomData).then(() => {
                    onlineRoom = roomCode;
                    STATE.gameMode = 'online';
                    STATE.screen = 'playing';
                    STATE.isRunning = true;
                    resetGame();
                    listenToRoom(roomCode);
                    alert(`Room created! Code: ${roomCode}\nShare this code with friends.`);
                }).catch(err => {
                    alert('Failed to create room: ' + err.message);
                });
            }

            function joinPublicRoom() {
                if (!firebaseReady) {
                    alert('Firebase not connected. Online mode unavailable.');
                    return;
                }
                onlineRef.once('value').then(snapshot => {
                    const rooms = snapshot.val();
                    if (!rooms) {
                        alert('No public rooms available. Create one!');
                        return;
                    }
                    const availableRooms = Object.entries(rooms).filter(([code, data]) =>
                        data.status === 'waiting' && data.players && Object.keys(data.players).length < 4
                    );
                    if (availableRooms.length === 0) {
                        alert('No available rooms. Create one!');
                        return;
                    }
                    const [roomCode] = availableRooms[0];
                    joinRoom(roomCode);
                }).catch(err => {
                    alert('Error finding rooms: ' + err.message);
                });
            }

            function joinRoom(roomCode) {
                onlinePlayerId = 'player_' + Date.now();
                onlineRoom = roomCode;
                onlineRef.child(roomCode + '/players/' + onlinePlayerId).set({
                    x: CONFIG.DINO_X,
                    y: CONFIG.GROUND_Y,
                    score: 0,
                    isDead: false,
                    skin: STATE.currentSkin,
                    name: 'Player'
                }).then(() => {
                    STATE.gameMode = 'online';
                    STATE.screen = 'playing';
                    STATE.isRunning = true;
                    resetGame();
                    listenToRoom(roomCode);
                }).catch(err => {
                    alert('Failed to join room: ' + err.message);
                });
            }

            function listenToRoom(roomCode) {
                onlineRef.child(roomCode).on('value', snapshot => {
                    const data = snapshot.val();
                    if (!data) return;
                    onlinePlayers = data.players || {};
                    if (data.status === 'playing' && STATE.screen !== 'playing') {
                        STATE.screen = 'playing';
                        STATE.isRunning = true;
                        resetGame();
                    }
                    if (data.status === 'finished') {
                        // Show results
                        const alive = Object.entries(onlinePlayers).filter(([id, p]) => !p.isDead);
                        if (alive.length <= 1 && Object.keys(onlinePlayers).length > 1) {
                            STATE.isRunning = false;
                            STATE.isDead = true;
                        }
                    }
                });
            }

            function syncOnlineState() {
                if (!onlineRoom || !onlinePlayerId || !firebaseReady) return;
                const playerData = {
                    x: PLAYER.x,
                    y: PLAYER.y,
                    score: Math.floor(STATE.score),
                    isDead: STATE.isDead,
                    skin: STATE.currentSkin,
                    name: onlinePlayerId.startsWith('host_') ? 'Host' : 'Player',
                };
                onlineRef.child(onlineRoom + '/players/' + onlinePlayerId).update(playerData).catch(() => {});
                // Update room status
                if (STATE.isDead) {
                    const allDead = Object.values(onlinePlayers).every(p => p.isDead);
                    if (allDead || Object.keys(onlinePlayers).length <= 1) {
                        onlineRef.child(onlineRoom + '/status').set('finished').catch(() => {});
                    }
                }
            }

            function drawOnlinePlayers() {
                if (STATE.gameMode !== 'online') return;
                Object.entries(onlinePlayers).forEach(([id, data]) => {
                    if (id === onlinePlayerId) return;
                    if (data.isDead) {
                        ctx.fillStyle = 'rgba(255,0,0,0.5)';
                        ctx.font = '12px monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('💀 ' + (data.name || 'Player'), data.x || CONFIG.DINO_X, (data.y || CONFIG
                            .GROUND_Y) - 55);
                        return;
                    }
                    ctx.save();
                    ctx.globalAlpha = 0.7;
                    drawDino(data.x || CONFIG.DINO_X, data.y || CONFIG.GROUND_Y, false, STATE.frameCount, data.skin ||
                        0, 0.7);
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.font = '10px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(data.name || 'Player', data.x || CONFIG.DINO_X, (data.y || CONFIG.GROUND_Y) - 55);
                    ctx.restore();
                });
            }

            // ──────────────────────────────────────────────
            // INPUT HANDLING
            // ──────────────────────────────────────────────
            function handleInput() {
                if (STATE.screen === 'playing' && STATE.isRunning) {
                    const p = STATE.gameMode === 'local2p' && !PLAYER2.isDead ? PLAYER2 : PLAYER;

                    // Player 1
                    if ((INPUT.space || INPUT.touchJump) && !STATE.isDead) {
                        if (PLAYER.inputLag > 0) {
                            PLAYER.queuedJump = true;
                        } else {
                            doJump(PLAYER, false);
                        }
                        INPUT.space = false;
                        INPUT.touchJump = false;
                    }
                    if (INPUT.down || INPUT.touchDuck) {
                        if (PLAYER.inputLag > 0) {
                            PLAYER.queuedDuck = true;
                        } else {
                            PLAYER.isDucking = true;
                        }
                    } else if (!INPUT.down && !INPUT.touchDuck) {
                        PLAYER.isDucking = false;
                        PLAYER.queuedDuck = false;
                    }

                    // Player 2
                    if (STATE.gameMode === 'local2p' && !PLAYER2.isDead) {
                        if (INPUT.w) {
                            if (PLAYER2.inputLag > 0) {
                                PLAYER2.queuedJump = true;
                            } else {
                                doJump(PLAYER2, true);
                            }
                            INPUT.w = false;
                        }
                        if (INPUT.s) {
                            if (PLAYER2.inputLag > 0) {
                                PLAYER2.queuedDuck = true;
                            } else {
                                PLAYER2.isDucking = true;
                            }
                        } else if (!INPUT.s) {
                            PLAYER2.isDucking = false;
                            PLAYER2.queuedDuck = false;
                        }
                    }
                }
            }

            document.addEventListener('keydown', (e) => {
                initAudio();
                const key = e.key.toLowerCase();
                if (key === ' ' || key === 'spacebar') {
                    e.preventDefault();
                    INPUT.space = true;
                    if (STATE.screen === 'menu') handleMenuAction('startSingle');
                    if (STATE.screen === 'gameover') restartGame();
                }
                if (key === 'arrowdown' || key === 'down') { e.preventDefault();
                    INPUT.down = true; }
                if (key === 'w') { e.preventDefault();
                    INPUT.w = true; }
                if (key === 's') { e.preventDefault();
                    INPUT.s = true; }
                if (key === 'escape') {
                    e.preventDefault();
                    if (STATE.screen === 'playing') {
                        STATE.isRunning = false;
                        STATE.screen = 'menu';
                        if (onlineRoom) {
                            onlineRef.child(onlineRoom).remove().catch(() => {});
                            onlineRoom = null;
                        }
                    } else if (STATE.screen !== 'menu') {
                        STATE.screen = 'menu';
                    }
                }
                if (key === 'c' && STATE.screen === 'onlineMenu') createOnlineRoom();
                if (key === 'j' && STATE.screen === 'onlineMenu') joinPublicRoom();
            });

            document.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (key === ' ' || key === 'spacebar') INPUT.space = false;
                if (key === 'arrowdown' || key === 'down') INPUT.down = false;
                if (key === 'w') INPUT.w = false;
                if (key === 's') INPUT.s = false;
            });

            canvas.addEventListener('click', (e) => {
                initAudio();
                const rect = canvas.getBoundingClientRect();
                const scaleX = CONFIG.CANVAS_WIDTH / rect.width;
                const scaleY = CONFIG.CANVAS_HEIGHT / rect.height;
                const mx = (e.clientX - rect.left) * scaleX;
                const my = (e.clientY - rect.top) * scaleY;
                if (STATE.screen === 'menu') handleMenuClick(mx, my);
                if (STATE.screen === 'gameover') restartGame();
                if (STATE.screen === 'upgradesMenu') handleMenuClick(mx, my);
                if (STATE.screen === 'skinsMenu') handleMenuClick(mx, my);
                if (STATE.screen === 'onlineMenu') handleMenuClick(mx, my);
                if (STATE.screen === 'settingsMenu') handleMenuClick(mx, my);
                if (STATE.screen === 'leaderboardMenu') STATE.screen = 'menu';
                if (STATE.screen === 'playing' && STATE.isRunning && !STATE.isDead) {
                    INPUT.touchJump = true;
                    setTimeout(() => { INPUT.touchJump = false; }, 100);
                }
            });

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                initAudio();
                const touch = e.touches[0];
                INPUT.touchStartY = touch.clientY;
                INPUT.touchJump = true;
                if (STATE.screen === 'menu') handleMenuAction('startSingle');
                if (STATE.screen === 'gameover') restartGame();
                setTimeout(() => { INPUT.touchJump = false; }, 100);
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                INPUT.swipeY = touch.clientY - INPUT.touchStartY;
                if (INPUT.swipeY > 30) INPUT.touchDuck = true;
                else INPUT.touchDuck = false;
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                INPUT.touchJump = false;
                INPUT.touchDuck = false;
                INPUT.swipeY = 0;
            }, { passive: false });

            // Mobile buttons
            document.getElementById('btn-jump')?.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                initAudio();
                INPUT.touchJump = true;
                if (STATE.screen === 'menu') handleMenuAction('startSingle');
                if (STATE.screen === 'gameover') restartGame();
            });
            document.getElementById('btn-jump')?.addEventListener('pointerup', (e) => {
                e.preventDefault();
                INPUT.touchJump = false;
            });
            document.getElementById('btn-duck')?.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                INPUT.touchDuck = true;
            });
            document.getElementById('btn-duck')?.addEventListener('pointerup', (e) => {
                e.preventDefault();
                INPUT.touchDuck = false;
            });

            function restartGame() {
                STATE.screen = 'playing';
                STATE.isRunning = true;
                resetGame();
            }

            // ──────────────────────────────────────────────
            // MAIN GAME LOOP
            // ──────────────────────────────────────────────
            function update() {
                if (STATE.screen !== 'playing' || !STATE.isRunning) return;
                if (STATE.isDead) return;

                STATE.frameCount++;
                const effectiveSpeed = STATE.slowmoActive || PLAYER.slowmoActive ?
                    STATE.speed * CONFIG.SLOWMO_FACTOR :
                    STATE.speed;

                // Score
                STATE.score += CONFIG.SCORE_PER_FRAME * (effectiveSpeed / CONFIG.INITIAL_SPEED);
                if (Math.floor(STATE.score) % 100 === 0 && Math.floor(STATE.score) > 0 &&
                    Math.floor(STATE.score) !== Math.floor(STATE.score - CONFIG.SCORE_PER_FRAME)) {
                    sfxMilestone();
                }

                // Speed increase
                const maxSpeed = CONFIG.MAX_SPEED * (1 - (STATE.upgradeLevels['speedControl'] || 0) * 0.08);
                if (STATE.speed < maxSpeed && Math.floor(STATE.score) % 100 === 0 &&
                    Math.floor(STATE.score) > 0 &&
                    Math.floor(STATE.score) !== Math.floor(STATE.score - CONFIG.SCORE_PER_FRAME)) {
                    STATE.speed += CONFIG.SPEED_INCREMENT;
                    STATE.speed = Math.min(STATE.speed, maxSpeed);
                }

                // Day/night cycle
                STATE.dayNight = Math.floor(STATE.score / CONFIG.DAY_NIGHT_INTERVAL);

                // Scroll ground
                STATE.groundScroll += effectiveSpeed;

                // Update players
                updatePlayer(PLAYER, false);
                if (STATE.gameMode === 'local2p' && !PLAYER2.isDead) {
                    updatePlayer(PLAYER2, true);
                    PLAYER2.score += CONFIG.SCORE_PER_FRAME * (effectiveSpeed / CONFIG.INITIAL_SPEED);
                }

                // Move obstacles
                const allObs = STATE.activeEvent === 'gravityGlitch' ?
                    [...obstacles, ...chickens].map(o => ({
                        ...o,
                        originalY: o.y,
                        y: o.y + Math.sin(STATE.frameCount * 0.05 + o.x * 0.02) * 30
                    })) :
                    [...obstacles, ...chickens];

                [...obstacles, ...chickens].forEach(o => {
                    o.x -= effectiveSpeed;
                });
                obstacles = obstacles.filter(o => o.x > -60);
                chickens = chickens.filter(o => o.x > -60);

                // Spawn obstacles
                const lastObs = [...obstacles, ...chickens].reduce((max, o) => Math.max(max, o.x), 0);
                const minGap = CONFIG.OBSTACLE_MIN_GAP / (1 + (STATE.upgradeLevels['eagleEye'] || 0) * 0.2);
                if (lastObs < CONFIG.CANVAS_WIDTH - minGap - Math.random() * (CONFIG.OBSTACLE_MAX_GAP - minGap)) {
                    spawnObstacle();
                }

                // Spawn powerups
                const powerupChance = CONFIG.POWERUP_CHANCE * (1 + (STATE.upgradeLevels['luckyPaws'] || 0) * 0.2);
                if (Math.random() < powerupChance && powerups.length < 3) {
                    spawnPowerup();
                }

                // Spawn bones
                if (Math.random() < CONFIG.BONE_CHANCE && bones.length < 5) {
                    spawnBone();
                }

                // Move powerups & bones
                powerups.forEach(p => p.x -= effectiveSpeed);
                powerups = powerups.filter(p => p.x > -40);
                bones.forEach(b => b.x -= effectiveSpeed);
                bones = bones.filter(b => b.x > -40);

                // Check collisions
                if (handleCollision(PLAYER, false)) {
                    STATE.isDead = true;
                    STATE.shakeTimer = 20;
                    STATE.shakeIntensity = 12;
                    sfxDeath();
                    for (let i = 0; i < 30; i++) {
                        particles.push({
                            x: PLAYER.x,
                            y: PLAYER.y - 20,
                            vx: (Math.random() - 0.5) * 8,
                            vy: (Math.random() - 0.5) * 8 - 4,
                            life: 30 + Math.random() * 20,
                            maxLife: 50,
                            color: ['#333', '#555', '#777', '#999'][Math.floor(Math.random() * 4)],
                            size: 3 + Math.random() * 5,
                        });
                    }
                    saveReplayData();
                    if (STATE.score > STATE.highScore) STATE.highScore = Math.floor(STATE.score);
                    // Daily score
                    const today = new Date().toISOString().split('T')[0];
                    if (STATE.dailyScore.date === today && STATE.score > STATE.dailyScore.score) {
                        STATE.dailyScore.score = Math.floor(STATE.score);
                        if (!STATE.skinUnlocks['chad']) {
                            STATE.skinUnlocks['chad'] = true;
                            CONFIG.SKINS.find(s => s.id === 'chad').unlocked = true;
                        }
                    }
                    // Ninja skin check
                    if (!PLAYER.powerup && STATE.score >= 500 && !STATE.skinUnlocks['ninja']) {
                        STATE.skinUnlocks['ninja'] = true;
                        CONFIG.SKINS.find(s => s.id === 'ninja').unlocked = true;
                    }
                    // Beat AI
                    if (STATE.aiGhostX < PLAYER.x && !STATE.aiGhostDead) {
                        STATE.aiBeatCount++;
                        if (STATE.aiBeatCount >= 5 && !STATE.skinUnlocks['corporate']) {
                            STATE.skinUnlocks['corporate'] = true;
                            CONFIG.SKINS.find(s => s.id === 'corporate').unlocked = true;
                        }
                    }
                    checkSkinUnlocks();
                    updateLeaderboard('');
                    saveAllState();
                    STATE.screen = 'gameover';
                    STATE.isRunning = false;
                    if (onlineRoom) {
                        syncOnlineState();
                        onlineRef.child(onlineRoom).off();
                    }
                    return;
                }

                if (STATE.gameMode === 'local2p' && !PLAYER2.isDead && handleCollision(PLAYER2, true)) {
                    PLAYER2.isDead = true;
                    for (let i = 0; i < 20; i++) {
                        particles.push({
                            x: PLAYER2.x,
                            y: PLAYER2.y - 20,
                            vx: (Math.random() - 0.5) * 6,
                            vy: (Math.random() - 0.5) * 6 - 3,
                            life: 20 + Math.random() * 15,
                            maxLife: 35,
                            color: '#e74c3c',
                            size: 3 + Math.random() * 4,
                        });
                    }
                    if (!STATE.isDead) {
                        STATE.aiOvertakeMsg = 'Player 1 is the last dino standing!';
                        STATE.aiOvertakeTimer = 180;
                    }
                }

                // Check both dead in 2P
                if (STATE.gameMode === 'local2p' && STATE.isDead && PLAYER2.isDead) {
                    STATE.screen = 'gameover';
                    STATE.isRunning = false;
                    saveAllState();
                }

                // Powerup collection
                for (let i = powerups.length - 1; i >= 0; i--) {
                    const pu = powerups[i];
                    const collectX = Math.abs(PLAYER.x - pu.x) < 28;
                    const collectY = Math.abs((PLAYER.isDucking ? PLAYER.y + 18 : PLAYER.y) - 20 - pu.y) < 28;
                    if (collectX && collectY && !STATE.isDead) {
                        applyPowerupEffect(PLAYER, pu.subtype);
                        powerups.splice(i, 1);
                        continue;
                    }
                    if (STATE.gameMode === 'local2p' && !PLAYER2.isDead) {
                        const c2X = Math.abs(PLAYER2.x - pu.x) < 28;
                        const c2Y = Math.abs((PLAYER2.isDucking ? PLAYER2.y + 18 : PLAYER2.y) - 20 - pu.y) < 28;
                        if (c2X && c2Y) {
                            applyPowerupEffect(PLAYER2, pu.subtype);
                            powerups.splice(i, 1);
                        }
                    }
                }

                // Bone collection
                for (let i = bones.length - 1; i >= 0; i--) {
                    const b = bones[i];
                    const dist = Math.hypot(PLAYER.x - b.x, PLAYER.y - b.y);
                    const collectDist = PLAYER.magnetActive ? 120 : 28;
                    if (dist < collectDist) {
                        if (PLAYER.magnetActive) {
                            b.x += (PLAYER.x - b.x) * 0.2;
                            b.y += (PLAYER.y - b.y) * 0.2;
                        }
                        if (dist < 28) {
                            STATE.bones++;
                            sfxBone();
                            bones.splice(i, 1);
                        }
                    }
                }

                // Update AI
                updateAI();

                // Update events
                updateEvent();

                // Update particles
                updateParticles();

                // Shake
                if (STATE.shakeTimer > 0) STATE.shakeTimer--;

                // Sync online
                if (STATE.gameMode === 'online' && STATE.frameCount % 10 === 0) {
                    syncOnlineState();
                }

                // Save periodically
                if (STATE.frameCount % 300 === 0) saveAllState();
            }

            function render() {
                ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
                ctx.save();

                if (STATE.screen === 'menu') {
                    drawMenuScreen();
                    ctx.restore();
                    return;
                }

                if (STATE.screen === 'upgradesMenu') {
                    drawUpgradesMenu();
                    ctx.restore();
                    return;
                }
                if (STATE.screen === 'skinsMenu') {
                    drawSkinsMenu();
                    ctx.restore();
                    return;
                }
                if (STATE.screen === 'leaderboardMenu') {
                    drawLeaderboardMenu();
                    ctx.restore();
                    return;
                }
                if (STATE.screen === 'onlineMenu') {
                    drawOnlineMenu();
                    ctx.restore();
                    return;
                }
                if (STATE.screen === 'settingsMenu') {
                    drawSettingsMenu();
                    ctx.restore();
                    return;
                }

                // Playing screen
                drawScreenShake();
                drawBackground();
                drawGround(STATE.groundScroll);

                // Rave mode
                if (STATE.activeEvent === 'raveMode' && STATE.frameCount % 4 < 2) {
                    ctx.fillStyle = 'rgba(255,0,255,0.08)';
                    ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
                }

                // Draw obstacles
                const displayObs = STATE.activeEvent === 'gravityGlitch' ?
                    [...obstacles, ...chickens].map(o => ({
                        ...o,
                        y: CONFIG.GROUND_Y + Math.sin(STATE.frameCount * 0.05 + o.x * 0.02) * 30
                    })) :
                    [...obstacles, ...chickens];
                displayObs.forEach(o => {
                    const obsCopy = { ...o };
                    if (STATE.activeEvent === 'gravityGlitch') {
                        obsCopy.yOffset = Math.sin(STATE.frameCount * 0.05 + o.x * 0.02) * 30;
                    }
                    drawObstacle(obsCopy);
                });

                // Draw bones
                bones.forEach(b => drawBone(b));

                // Draw powerups
                powerups.forEach(p => drawPowerup(p));

                // Draw AI ghost
                drawAIGhost();

                // Draw online players
                drawOnlinePlayers();

                // Draw Player 1
                if (!STATE.isDead) {
                    if (PLAYER.shieldActive) drawShieldAura(PLAYER.x, PLAYER.y, PLAYER.isDucking);
                    drawDino(PLAYER.x, PLAYER.y, PLAYER.isDucking, PLAYER.animFrame, STATE.currentSkin);
                }

                // Draw Player 2
                if (STATE.gameMode === 'local2p' && !PLAYER2.isDead) {
                    if (PLAYER2.shieldActive) drawShieldAura(PLAYER2.x, PLAYER2.y, PLAYER2.isDucking);
                    drawDino(PLAYER2.x, PLAYER2.y, PLAYER2.isDucking, PLAYER2.animFrame, 2, 1, true);
                }

                // Draw particles
                drawParticles();

                // Draw HUD
                drawHUD();

                // Game over overlay
                if (STATE.screen === 'gameover') {
                    drawGameOverScreen();
                }

                clearScreenShake();
                ctx.restore();
            }

            function gameLoop() {
                handleInput();
                update();
                render();
                requestAnimationFrame(gameLoop);
            }

            // ──────────────────────────────────────────────
            // INITIALIZATION
            // ──────────────────────────────────────────────
            function init() {
                loadAllState();
                initFirebase();
                resizeCanvas();
                STATE.screen = 'menu';
                STATE.frameCount = 0;
                STATE.groundScroll = 0;
