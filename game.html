<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dino Runner+ - Ultimate</title>
    <style>
        :root {
            --bg-primary: #0f0c29;
            --accent-gold: #ffd700;
            --accent-red: #ff6b6b;
            --accent-blue: #4fc3f7;
            --text-primary: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            position: fixed;
            top: 0;
            left: 0;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: pointer;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #music-indicator {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .wasted-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 30;
            pointer-events: none;
        }
        .wasted-overlay.active {
            display: flex;
        }
        .wasted-text {
            font-family: 'Impact', sans-serif;
            font-size: 80px;
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255,0,0,0.5);
            animation: wastedPulse 0.5s ease-in-out;
        }
        @keyframes wastedPulse {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="music-indicator">🎵 MENU</div>
        <div class="wasted-overlay" id="wasted-overlay">
            <div class="wasted-text">WASTED</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <script>
    (function() {
        // ═══════════════════════════════════════════
        // CANVAS SETUP - True Fullscreen
        // ═══════════════════════════════════════════
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let W, H, GROUND_RATIO = 0.78;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => setTimeout(resize, 150));
        resize();

        // ═══════════════════════════════════════════
        // WEATHER SYSTEM - Changes every 60 seconds
        // ═══════════════════════════════════════════
        const WEATHERS = [
            { name: 'Sunny Day', skyTop: '#4a90d9', skyBot: '#c9e4ff', ground: '#c8b99a', duration: 60 },
            { name: 'Sunset', skyTop: '#e0995e', skyBot: '#ffcc80', ground: '#d4a574', duration: 60 },
            { name: 'Night', skyTop: '#0a0a2e', skyBot: '#1a1a3e', ground: '#3a3a5a', duration: 60 },
            { name: 'Rainy', skyTop: '#4a4a5a', skyBot: '#6a6a7a', ground: '#8a8a7a', duration: 60 },
            { name: 'Snowy', skyTop: '#b0c4de', skyBot: '#e8e8f0', ground: '#d0d0d0', duration: 60 },
            { name: 'Desert', skyTop: '#e8c170', skyBot: '#f5deb3', ground: '#d2b48c', duration: 60 },
            { name: 'Alien', skyTop: '#2d004d', skyBot: '#6a0dad', ground: '#3d1a5c', duration: 60 },
            { name: 'Ocean', skyTop: '#006994', skyBot: '#87ceeb', ground: '#4682b4', duration: 60 },
        ];

        // ═══════════════════════════════════════════
        // CONFIGURATION
        // ═══════════════════════════════════════════
        const CONFIG = {
            get GROUND_Y() { return Math.floor(H * GROUND_RATIO); },
            get DINO_X() { return W * 0.12; },
            GRAVITY: 0.55,
            JUMP_FORCE: -11.5,
            JETPACK_FORCE: -3.5,
            INITIAL_SPEED: 4.5,
            MAX_SPEED: 10,
            SPEED_INCREMENT: 0.2,
            SCORE_PER_FRAME: 0.1,
            OBSTACLE_MIN_GAP: 260,
            OBSTACLE_MAX_GAP: 480,
            JETPACK_CHANCE: 0.015,
            POWERUP_DURATION: 480,
            CHARACTERS: [
                { id: 'dino', name: 'Classic Dino', emoji: '🦖', color: '#2d5a27', accent: '#4a8c3f', unlock: true },
                { id: 'cat', name: 'Ninja Cat', emoji: '🐱', color: '#1a1a1a', accent: '#e74c3c', unlock: true },
                { id: 'dog', name: 'Super Dog', emoji: '🐕', color: '#8b4513', accent: '#ffd700', unlock: true },
                { id: 'penguin', name: 'Cool Penguin', emoji: '🐧', color: '#1a1a2e', accent: '#4fc3f7', unlock: true },
                { id: 'unicorn', name: 'Magic Unicorn', emoji: '🦄', color: '#ff69b4', accent: '#ffd700', unlock: false, req: 'Score 500+' },
                { id: 'dragon', name: 'Fire Dragon', emoji: '🐉', color: '#8b0000', accent: '#ff4500', unlock: false, req: 'Score 1000+' },
                { id: 'monkey', name: 'Crazy Monkey', emoji: '🐵', color: '#8b6914', accent: '#daa520', unlock: false, req: 'Collect 20 coins' },
                { id: 'robot', name: 'Robot Dino', emoji: '🤖', color: '#808080', accent: '#c0c0c0', unlock: false, req: 'Score 1500+' },
            ],
            COIN_REPLACEMENTS: ['🍕', '🍔', '🌮', '🍩', '🎸', '💎', '⭐', '🎯', '🔮', '🎪']
        };

        // ═══════════════════════════════════════════
        // GAME STATE
        // ═══════════════════════════════════════════
        const STATE = {
            screen: 'playing',
            gameMode: 'single',
            running: true,
            dead: false,
            score: 0,
            highScore: 0,
            coins: 0,
            speed: CONFIG.INITIAL_SPEED,
            frame: 0,
            groundScroll: 0,
            currentChar: 0,
            charUnlocks: { dino: true, cat: true, dog: true, penguin: true },
            weatherIndex: 0,
            weatherTimer: 3600,
            musicMood: 'action',
            wastedTimer: 0,
            wastedActive: false,
            parachuteActive: false,
            parachuteY: -100,
            parachuteTimer: 0,
            jetpackCollected: 0,
        };

        const PLAYER = {
            x: CONFIG.DINO_X,
            y: CONFIG.GROUND_Y,
            vy: 0,
            jumping: false,
            doubleJumped: false,
            animFrame: 0,
            animTimer: 0,
            jetpack: false,
            jetpackTimer: 0,
            jetpackFuel: 100,
            dead: false,
            canControlJetpack: false,
        };

        let obstacles = [], jetpacks = [], coins = [], particles = [], dustParticles = [];
        let aiPlayers = [];
        const INPUT = { jump: false, up: false, down: false, left: false, right: false, touchJump: false };

        // Audio
        let audioCtx = null, masterGain = null, musicGain = null, audioEnabled = true;

        // Firebase
        let onlineRef = null, firebaseReady = false, onlineRoom = null, onlinePlayerId = null, onlinePlayers = {};

        // ═══════════════════════════════════════════
        // AUDIO SYSTEM
        // ═══════════════════════════════════════════
        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    masterGain = audioCtx.createGain();
                    masterGain.gain.value = 0.3;
                    masterGain.connect(audioCtx.destination);
                    musicGain = audioCtx.createGain();
                    musicGain.gain.value = 0.15;
                    musicGain.connect(masterGain);
                } catch(e) {}
            }
        }

        function resumeAudio() {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, dur, type='square', vol=0.3) {
            if (!audioEnabled || !audioCtx || audioCtx.state !== 'running') return;
            try {
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(vol * 0.5, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(t);
                osc.stop(t + dur);
            } catch(e) {}
        }

        function sfxJump() { playTone(600,0.08); playTone(900,0.06,'sine'); }
        function sfxDeath() { playTone(300,0.4,'sawtooth',0.4); }
        function sfxMilestone() { playTone(523,0.08,'sine'); playTone(659,0.08,'sine'); }
        function sfxPickup() { playTone(880,0.06); }
        function sfxJetpack() { playTone(400,0.1,'sawtooth'); playTone(600,0.08,'sine'); }
        function sfxParachute() { playTone(200,0.3,'triangle',0.2); }

        // ═══════════════════════════════════════════
        // BACKGROUND MUSIC - Auto-generated procedural
        // ═══════════════════════════════════════════
        let musicInterval = null;
        let currentMusicNotes = [];

        function startMusic() {
            if (!audioCtx || audioCtx.state !== 'running') return;
            stopMusic();
            const weather = WEATHERS[STATE.weatherIndex];
            const moods = {
                'Sunny Day': { notes: [261,329,392,523], tempo: 0.5, type: 'sine' },
                'Sunset': { notes: [220,277,330,440], tempo: 0.6, type: 'triangle' },
                'Night': { notes: [196,246,293,392], tempo: 0.7, type: 'sine' },
                'Rainy': { notes: [175,220,262,349], tempo: 0.55, type: 'triangle' },
                'Snowy': { notes: [294,370,440,587], tempo: 0.45, type: 'sine' },
                'Desert': { notes: [330,392,494,659], tempo: 0.5, type: 'square' },
                'Alien': { notes: [150,225,300,450], tempo: 0.4, type: 'sawtooth' },
                'Ocean': { notes: [262,330,392,523], tempo: 0.55, type: 'sine' },
            };
            const mood = moods[weather.name] || moods['Sunny Day'];
            
            let noteIndex = 0;
            musicInterval = setInterval(() => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                const note = mood.notes[noteIndex % mood.notes.length];
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = mood.type;
                osc.frequency.setValueAtTime(note, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + mood.tempo);
                osc.connect(gain);
                gain.connect(musicGain);
                osc.start();
                osc.stop(audioCtx.currentTime + mood.tempo);
                noteIndex++;
            }, mood.tempo * 1000);
            
            document.getElementById('music-indicator').textContent = '🎵 ' + weather.name;
        }

        function stopMusic() {
            if (musicInterval) {
                clearInterval(musicInterval);
                musicInterval = null;
            }
        }

        // ═══════════════════════════════════════════
        // COLLISION SYSTEM
        // ═══════════════════════════════════════════
        function getPlayerBounds() {
            const w = 30, h = 40;
            return {
                x: PLAYER.x - w/2 + 4,
                y: PLAYER.y - h + 4,
                w: w - 8,
                h: h - 6
            };
        }

        function getObstacleBounds(obs) {
            const oh = obs.type === 'pterodactyl' ? obs.height : (obs.height || 45);
            const ow = obs.type === 'pterodactyl' ? 36 : 16;
            return {
                x: obs.x - ow/2 + 3,
                y: CONFIG.GROUND_Y - oh + 2,
                w: ow - 6,
                h: oh - 4
            };
        }

        function aabbCollision(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function checkCollision() {
            const pBounds = getPlayerBounds();
            for (let i = obstacles.length - 1; i >= 0; i--) {
                if (aabbCollision(pBounds, getObstacleBounds(obstacles[i]))) {
                    if (PLAYER.jetpack && PLAYER.y < CONFIG.GROUND_Y - 40) continue;
                    return true;
                }
            }
            return false;
        }

        // ═══════════════════════════════════════════
        // SPAWNING
        // ═══════════════════════════════════════════
        function spawnObstacle() {
            const lastObs = obstacles.length ? Math.max(...obstacles.map(o => o.x)) : 0;
            if (lastObs < W - CONFIG.OBSTACLE_MIN_GAP) {
                const spawnX = W + 50 + Math.random() * 200;
                if (Math.random() < 0.4) {
                    obstacles.push({ x: spawnX, type: 'pterodactyl', height: 45 + Math.random()*50, width: 44 });
                } else {
                    obstacles.push({ x: spawnX, type: 'cactus', height: 40+Math.random()*30, width: 18 });
                }
            }
        }

        function spawnJetpack() {
            if (jetpacks.length >= 2) return;
            jetpacks.push({ x: W + 60 + Math.random()*200, y: CONFIG.GROUND_Y - 60 - Math.random()*40 });
        }

        function spawnCoin() {
            if (coins.length >= 8) return;
            const emojis = CONFIG.COIN_REPLACEMENTS;
            coins.push({ 
                x: W + 40 + Math.random()*150, 
                y: CONFIG.GROUND_Y - 15,
                emoji: emojis[Math.floor(Math.random() * emojis.length)]
            });
        }
                // ═══════════════════════════════════════════
        // RENDERING SYSTEM
        // ═══════════════════════════════════════════
        function getCurrentWeather() {
            return WEATHERS[STATE.weatherIndex];
        }

        function drawSky() {
            const weather = getCurrentWeather();
            const grad = ctx.createLinearGradient(0, 0, 0, CONFIG.GROUND_Y);
            grad.addColorStop(0, weather.skyTop);
            grad.addColorStop(1, weather.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, CONFIG.GROUND_Y);

            // Weather effects
            if (weather.name === 'Rainy') {
                ctx.fillStyle = 'rgba(100,150,200,0.3)';
                for (let i = 0; i < 50; i++) {
                    const rx = (i * 37 + STATE.frame * 3) % W;
                    const ry = (i * 23 + STATE.frame * 5) % CONFIG.GROUND_Y;
                    ctx.fillRect(rx, ry, 2, 8);
                }
            } else if (weather.name === 'Snowy') {
                ctx.fillStyle = '#fff';
                for (let i = 0; i < 40; i++) {
                    const sx = (i * 47 + STATE.frame * 1.5) % W;
                    const sy = (i * 31 + STATE.frame * 2) % CONFIG.GROUND_Y;
                    ctx.beginPath();
                    ctx.arc(sx, sy, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (weather.name === 'Alien') {
                ctx.fillStyle = 'rgba(100,0,200,0.2)';
                for (let i = 0; i < 20; i++) {
                    const ax = (i * 67 + Math.sin(STATE.frame * 0.05) * 50) % W;
                    const ay = (i * 43) % CONFIG.GROUND_Y;
                    ctx.beginPath();
                    ctx.arc(ax, ay, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Sun/Moon based on weather
            if (weather.name === 'Night') {
                ctx.fillStyle = '#f0f0f0';
                ctx.beginPath();
                ctx.arc(W * 0.15, CONFIG.GROUND_Y * 0.2, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                for (let i = 0; i < 30; i++) {
                    ctx.beginPath();
                    ctx.arc((i * 73) % W, (i * 31) % (CONFIG.GROUND_Y * 0.6), 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (weather.name !== 'Rainy') {
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath();
                ctx.arc(W * 0.8, CONFIG.GROUND_Y * 0.15, 30, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawGround() {
            const weather = getCurrentWeather();
            const y = CONFIG.GROUND_Y;
            const grad = ctx.createLinearGradient(0, y, 0, H);
            grad.addColorStop(0, weather.ground);
            grad.addColorStop(1, '#4a3a2a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, y, W, H - y);

            // Ground texture
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for (let x = -STATE.frame * 2 % 30; x < W; x += 30) {
                ctx.fillRect(x, y + 2, 15, 3);
            }
        }

        function drawCharacter(x, y, charIdx, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            const char = CONFIG.CHARACTERS[charIdx] || CONFIG.CHARACTERS[0];
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(x, CONFIG.GROUND_Y + 2, 18, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            // Body
            const grad = ctx.createLinearGradient(x, y - 44, x, y);
            grad.addColorStop(0, char.color);
            grad.addColorStop(1, char.accent);
            ctx.fillStyle = grad;
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(x - 17, y - 44, 34, 44, 9);
            ctx.fill();
            ctx.stroke();

            // Emoji face
            ctx.fillStyle = '#fff';
            ctx.font = '28px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(char.emoji, x, y - 18);

            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x + 7, y - 28, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#111';
            ctx.stroke();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x + 8, y - 28, 2, 0, Math.PI * 2);
            ctx.fill();

            // Legs animation
            const legOff = Math.sin(STATE.frame * 0.4) * 3;
            ctx.strokeStyle = char.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x - 5, y);
            ctx.lineTo(x - 8 + legOff, y + 14);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + 5, y);
            ctx.lineTo(x + 8 - legOff, y + 14);
            ctx.stroke();

            ctx.restore();
        }

        function drawParachute() {
            if (!STATE.parachuteActive) return;
            const px = PLAYER.x;
            const py = STATE.parachuteY;
            
            // Parachute canopy
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(px, py - 30, 25, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(px, py - 30, 25, Math.PI, 0);
            ctx.fill();
            
            // Stripes
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 4; i++) {
                ctx.fillRect(px - 20 + i * 13, py - 55, 6, 25);
            }
            
            // Lines
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(px - 15 + i * 15, py - 30);
                ctx.lineTo(px - 10 + i * 10, py);
                ctx.stroke();
            }
            
            // Player hanging
            drawCharacter(px, py, STATE.currentChar);
        }

        function drawJetpack(pack) {
            ctx.fillStyle = '#ff6d00';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(pack.x - 15, pack.y - 15, 30, 30, 7);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🚀', pack.x, pack.y + 7);
        }

        function drawCoin(coin) {
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(coin.emoji, coin.x, coin.y + 8);
        }

        function drawObstacle(obs) {
            if (obs.type === 'cactus') {
                const h = obs.height;
                ctx.fillStyle = getCurrentWeather().name === 'Snowy' ? '#a0c0a0' : '#2d5a27';
                ctx.strokeStyle = '#1a3a15';
                ctx.lineWidth = 2;
                ctx.fillRect(obs.x - 7, CONFIG.GROUND_Y - h, 14, h);
                ctx.strokeRect(obs.x - 7, CONFIG.GROUND_Y - h, 14, h);
            } else {
                const y = CONFIG.GROUND_Y - obs.height;
                ctx.fillStyle = '#555';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(obs.x, y + 15, 16, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(obs.x - 5, y + 10);
                ctx.lineTo(obs.x - 18, y - 5);
                ctx.lineTo(obs.x - 12, y + 5);
                ctx.fill();
            }
        }

        function drawHUD() {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(W - 180, 8, 172, 110);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 15px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`Score: ${Math.floor(STATE.score)}`, W - 18, 32);
            ctx.fillText(`HI: ${Math.floor(STATE.highScore)}`, W - 18, 54);
            ctx.fillText(`Coins: ${STATE.coins}`, W - 18, 76);
            
            if (PLAYER.jetpack) {
                const fuel = PLAYER.jetpackFuel / 100;
                ctx.fillStyle = fuel > 0.3 ? '#4caf50' : '#f44336';
                ctx.fillRect(W - 160, 82, 140 * fuel, 8);
                ctx.fillText(`Fuel: ${Math.floor(PLAYER.jetpackFuel)}%`, W - 18, 106);
            }
            
            // Weather indicator
            ctx.fillText(getCurrentWeather().name, W - 18, 118);
        }

        function drawWastedOverlay() {
            const overlay = document.getElementById('wasted-overlay');
            if (STATE.wastedActive) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

        // ═══════════════════════════════════════════
        // GAME LOGIC
        // ═══════════════════════════════════════════
        function resetGame() {
            PLAYER.x = CONFIG.DINO_X;
            PLAYER.y = CONFIG.GROUND_Y;
            PLAYER.vy = 0;
            PLAYER.jumping = false;
            PLAYER.doubleJumped = false;
            PLAYER.dead = false;
            PLAYER.jetpack = false;
            PLAYER.jetpackTimer = 0;
            PLAYER.jetpackFuel = 100;
            PLAYER.canControlJetpack = false;

            obstacles = [];
            jetpacks = [];
            coins = [];
            particles = [];
            dustParticles = [];

            STATE.score = 0;
            STATE.speed = CONFIG.INITIAL_SPEED;
            STATE.frame = 0;
            STATE.dead = false;
            STATE.wastedActive = false;
            STATE.wastedTimer = 0;
            STATE.parachuteActive = false;
            STATE.parachuteY = -100;
            STATE.parachuteTimer = 0;
            STATE.jetpackCollected = 0;
            STATE.weatherTimer = 3600;
            STATE.weatherIndex = 0;
            
            startMusic();
        }

        function triggerWasted() {
            STATE.wastedActive = true;
            STATE.wastedTimer = 90;
            PLAYER.dead = true;
            sfxDeath();
            
            if (STATE.score > STATE.highScore) {
                STATE.highScore = Math.floor(STATE.score);
            }
            saveState();
            
            // Activate parachute respawn after wasted
            setTimeout(() => {
                STATE.wastedActive = false;
                STATE.parachuteActive = true;
                STATE.parachuteY = -80;
                PLAYER.x = CONFIG.DINO_X + Math.random() * 200;
                PLAYER.y = -80;
                PLAYER.vy = 2;
                sfxParachute();
            }, 1500);
        }

        function updateJetpack() {
            if (!PLAYER.jetpack) return;
            
            PLAYER.jetpackTimer--;
            if (PLAYER.jetpackTimer <= 0) {
                PLAYER.jetpack = false;
                PLAYER.canControlJetpack = false;
                PLAYER.jetpackFuel = 100;
                return;
            }
            
            // Jetpack controls
            if (PLAYER.canControlJetpack) {
                if (INPUT.up || INPUT.touchJump) {
                    PLAYER.y -= 5;
                    PLAYER.jetpackFuel -= 0.5;
                    PLAYER.vy = 0;
                    if (PLAYER.y < 20) PLAYER.y = 20;
                }
                if (INPUT.down) {
                    PLAYER.y += 3;
                    PLAYER.jetpackFuel -= 0.3;
                    if (PLAYER.y > CONFIG.GROUND_Y) {
                        PLAYER.y = CONFIG.GROUND_Y;
                        PLAYER.jetpack = false;
                        PLAYER.canControlJetpack = false;
                    }
                }
                if (INPUT.left) {
                    PLAYER.x -= 4;
                    PLAYER.jetpackFuel -= 0.2;
                    if (PLAYER.x < 30) PLAYER.x = 30;
                }
                if (INPUT.right) {
                    PLAYER.x += 4;
                    PLAYER.jetpackFuel -= 0.2;
                    if (PLAYER.x > W - 30) PLAYER.x = W - 30;
                }
                
                // Exhaust particles
                if (Math.random() < 0.6) {
                    particles.push({
                        x: PLAYER.x - 5 + Math.random() * 10,
                        y: PLAYER.y + 15,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: 2 + Math.random() * 3,
                        life: 10,
                        maxLife: 15,
                        color: Math.random() < 0.5 ? '#ff6d00' : '#ffab00',
                        size: 3 + Math.random() * 3
                    });
                }
                
                if (PLAYER.jetpackFuel <= 0) {
                    PLAYER.jetpack = false;
                    PLAYER.canControlJetpack = false;
                    PLAYER.jetpackFuel = 100;
                }
            } else {
                // Auto-fly with jetpack
                PLAYER.y = Math.max(CONFIG.GROUND_Y - 100, PLAYER.y - 2.2);
                PLAYER.vy = Math.min(PLAYER.vy, 0);
            }
        }

        function updateParachute() {
            if (!STATE.parachuteActive) return;
            
            STATE.parachuteY += 2.5;
            PLAYER.y = STATE.parachuteY;
            
            if (STATE.parachuteY >= CONFIG.GROUND_Y) {
                STATE.parachuteY = CONFIG.GROUND_Y;
                PLAYER.y = CONFIG.GROUND_Y;
                STATE.parachuteActive = false;
                PLAYER.dead = false;
                PLAYER.vy = 0;
                PLAYER.jumping = false;
                STATE.score = 0;
                STATE.speed = CONFIG.INITIAL_SPEED;
                obstacles = [];
                jetpacks = [];
                coins = [];
            }
        }

        function updateWeather() {
            STATE.weatherTimer--;
            if (STATE.weatherTimer <= 0) {
                STATE.weatherIndex = (STATE.weatherIndex + 1) % WEATHERS.length;
                STATE.weatherTimer = 3600; // 60 seconds at 60fps
                startMusic();
            }
        }

        function update() {
            if (!STATE.running) return;

            STATE.frame++;
            updateWeather();

            // Wasted state
            if (STATE.wastedActive) {
                STATE.wastedTimer--;
                drawWastedOverlay();
                return;
            }

            // Parachute state
            if (STATE.parachuteActive) {
                updateParachute();
                drawWastedOverlay();
                return;
            }

            const effSpeed = STATE.speed;

            // Score
            STATE.score += CONFIG.SCORE_PER_FRAME * effSpeed / 4;
            if (Math.floor(STATE.score / 100) > Math.floor((STATE.score - 0.1) / 100)) {
                sfxMilestone();
            }

            // Speed increase
            if (STATE.speed < CONFIG.MAX_SPEED && Math.floor(STATE.score / 100) > Math.floor((STATE.score - 0.1) / 100)) {
                STATE.speed = Math.min(CONFIG.MAX_SPEED, STATE.speed + CONFIG.SPEED_INCREMENT);
            }

            STATE.groundScroll += effSpeed;

            // Update player
            if (!PLAYER.dead) {
                // Jetpack
                if (PLAYER.jetpack) {
                    updateJetpack();
                } else {
                    PLAYER.vy += CONFIG.GRAVITY;
                    PLAYER.y += PLAYER.vy;
                }

                // Ground check
                if (PLAYER.y >= CONFIG.GROUND_Y) {
                    PLAYER.y = CONFIG.GROUND_Y;
                    PLAYER.vy = 0;
                    PLAYER.jumping = false;
                    PLAYER.doubleJumped = false;
                }

                // Jump input
                if ((INPUT.jump || INPUT.touchJump) && !PLAYER.jumping && !PLAYER.jetpack) {
                    resumeAudio();
                    PLAYER.vy = CONFIG.JUMP_FORCE;
                    PLAYER.jumping = true;
                    PLAYER.doubleJumped = false;
                    sfxJump();
                    INPUT.jump = false;
                    INPUT.touchJump = false;
                } else if ((INPUT.jump || INPUT.touchJump) && PLAYER.jumping && !PLAYER.doubleJumped && !PLAYER.jetpack) {
                    PLAYER.vy = CONFIG.JUMP_FORCE * 0.8;
                    PLAYER.doubleJumped = true;
                    sfxJump();
                    INPUT.jump = false;
                    INPUT.touchJump = false;
                }

                // Dust particles
                if (PLAYER.y >= CONFIG.GROUND_Y - 2 && Math.random() < 0.4) {
                    dustParticles.push({
                        x: PLAYER.x - 8 + Math.random() * 16,
                        y: CONFIG.GROUND_Y + 2,
                        vx: -STATE.speed * 0.3,
                        vy: -Math.random() * 2,
                        life: 12,
                        maxLife: 20,
                        size: 2 + Math.random() * 3,
                        color: '#c0b090'
                    });
                }
            }

            // Move objects
            obstacles.forEach(o => o.x -= effSpeed);
            obstacles = obstacles.filter(o => o.x > -60);
            jetpacks.forEach(j => j.x -= effSpeed);
            jetpacks = jetpacks.filter(j => j.x > -40);
            coins.forEach(c => c.x -= effSpeed);
            coins = coins.filter(c => c.x > -40);

            // Spawn
            spawnObstacle();
            if (Math.random() < CONFIG.JETPACK_CHANCE && jetpacks.length < 2) spawnJetpack();
            if (Math.random() < 0.03 && coins.length < 8) spawnCoin();

            // Collision
            if (!PLAYER.dead && !STATE.wastedActive && !STATE.parachuteActive) {
                if (checkCollision()) {
                    triggerWasted();
                }
            }

            // Jetpack collection
            jetpacks.forEach((j, i) => {
                if (Math.abs(PLAYER.x - j.x) < 24 && Math.abs(PLAYER.y - 20 - j.y) < 24) {
                    PLAYER.jetpack = true;
                    PLAYER.jetpackTimer = CONFIG.POWERUP_DURATION;
                    PLAYER.canControlJetpack = true;
                    PLAYER.jetpackFuel = 100;
                    STATE.jetpackCollected++;
                    sfxJetpack();
                    jetpacks.splice(i, 1);
                }
            });

            // Coin collection
            coins.forEach((c, i) => {
                if (Math.abs(PLAYER.x - c.x) < 22 && Math.abs(PLAYER.y - c.y) < 22) {
                    STATE.coins++;
                    sfxPickup();
                    coins.splice(i, 1);
                }
            });

            // Update particles
            particles = particles.filter(p => { p.x += p.vx; p.y += p.vy; p.life--; return p.life > 0; });
            dustParticles = dustParticles.filter(p => { p.x += p.vx; p.y += p.vy; p.life--; return p.life > 0; });

            // Check unlocks
            checkUnlocks();

            drawWastedOverlay();
        }

        function checkUnlocks() {
            if (STATE.score >= 500 && !STATE.charUnlocks['unicorn']) {
                STATE.charUnlocks['unicorn'] = true;
                CONFIG.CHARACTERS.find(c => c.id === 'unicorn').unlock = true;
                saveState();
            }
            if (STATE.score >= 1000 && !STATE.charUnlocks['dragon']) {
                STATE.charUnlocks['dragon'] = true;
                CONFIG.CHARACTERS.find(c => c.id === 'dragon').unlock = true;
                saveState();
            }
            if (STATE.coins >= 20 && !STATE.charUnlocks['monkey']) {
                STATE.charUnlocks['monkey'] = true;
                CONFIG.CHARACTERS.find(c => c.id === 'monkey').unlock = true;
                saveState();
            }
            if (STATE.score >= 1500 && !STATE.charUnlocks['robot']) {
                STATE.charUnlocks['robot'] = true;
                CONFIG.CHARACTERS.find(c => c.id === 'robot').unlock = true;
                saveState();
            }
        }

        function saveState() {
            const data = {
                highScore: STATE.highScore,
                coins: STATE.coins,
                charUnlocks: STATE.charUnlocks,
                currentChar: STATE.currentChar
            };
            try { localStorage.setItem('dinoRunnerUltimate', JSON.stringify(data)); } catch(e) {}
        }

        function loadState() {
            try {
                const saved = JSON.parse(localStorage.getItem('dinoRunnerUltimate') || '{}');
                STATE.highScore = saved.highScore || 0;
                STATE.coins = saved.coins || 0;
                STATE.charUnlocks = saved.charUnlocks || { dino: true, cat: true, dog: true, penguin: true };
                STATE.currentChar = saved.currentChar || 0;
                CONFIG.CHARACTERS.forEach(c => {
                    if (STATE.charUnlocks[c.id]) c.unlock = true;
                });
            } catch(e) {}
        }

        // ═══════════════════════════════════════════
        // FIREBASE ONLINE - Fixed & Simplified
        // ═══════════════════════════════════════════
        function initFirebase() {
            try {
                if (typeof firebase === 'undefined') return;
                if (!firebase.apps.length) {
                    firebase.initializeApp({
                        apiKey: "AIzaSyBaNjHmi-VlW8aFDDVN38OJkQCShYY2sFg",
                        authDomain: "dominos-ftw.firebaseapp.com",
                        databaseURL: "https://dominos-ftw-default-rtdb.europe-west1.firebasedatabase.app",
                        projectId: "dominos-ftw",
                        storageBucket: "dominos-ftw.firebasestorage.app",
                        messagingSenderId: "476741872461",
                        appId: "1:476741872461:web:3dc979b05a6175eadda504"
                    });
                }
                onlineRef = firebase.database().ref('dinoRoomsUltimate');
                firebaseReady = true;
            } catch(e) { firebaseReady = false; }
        }

        function createOnlineRoom() {
            if (!firebaseReady) return;
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            onlinePlayerId = 'host_' + Date.now();
            onlineRoom = code;
            
            onlineRef.child(code).set({
                code: code,
                host: onlinePlayerId,
                players: {
                    [onlinePlayerId]: {
                        x: PLAYER.x,
                        y: PLAYER.y,
                        score: 0,
                        dead: false,
                        char: STATE.currentChar
                    }
                },
                status: 'waiting',
                created: Date.now()
            });
            
            listenToRoom(code);
        }

        function joinOnlineRoom(code) {
            if (!firebaseReady) return;
            onlinePlayerId = 'player_' + Date.now();
            onlineRoom = code;
            
            onlineRef.child(code + '/players/' + onlinePlayerId).set({
                x: PLAYER.x,
                y: PLAYER.y,
                score: 0,
                dead: false,
                char: STATE.currentChar
            });
            
            listenToRoom(code);
        }

        function listenToRoom(code) {
            onlineRef.child(code).on('value', (snap) => {
                const data = snap.val();
                if (!data) return;
                onlinePlayers = data.players || {};
                if (data.status === 'playing') {
                    STATE.running = true;
                }
            });
        }

        function syncOnline() {
            if (!onlineRoom || !onlinePlayerId || !firebaseReady) return;
            if (STATE.frame % 10 === 0) {
                onlineRef.child(onlineRoom + '/players/' + onlinePlayerId).update({
                    x: PLAYER.x,
                    y: PLAYER.y,
                    score: Math.floor(STATE.score),
                    dead: STATE.dead
                }).catch(() => {});
            }
        }

        // ═══════════════════════════════════════════
        // INPUT HANDLING
        // ═══════════════════════════════════════════
        document.addEventListener('keydown', (e) => {
            resumeAudio();
            const k = e.key;
            if (k === ' ' || k === 'Spacebar' || k === 'ArrowUp') {
                e.preventDefault();
                INPUT.jump = true;
                INPUT.up = true;
            }
            if (k === 'ArrowDown') { e.preventDefault(); INPUT.down = true; }
            if (k === 'ArrowLeft') { e.preventDefault(); INPUT.left = true; }
            if (k === 'ArrowRight') { e.preventDefault(); INPUT.right = true; }
        });

        document.addEventListener('keyup', (e) => {
            const k = e.key;
            if (k === ' ' || k === 'Spacebar' || k === 'ArrowUp') { INPUT.jump = false; INPUT.up = false; }
            if (k === 'ArrowDown') INPUT.down = false;
            if (k === 'ArrowLeft') INPUT.left = false;
            if (k === 'ArrowRight') INPUT.right = false;
        });

        canvas.addEventListener('click', () => {
            resumeAudio();
            INPUT.touchJump = true;
            setTimeout(() => INPUT.touchJump = false, 80);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            resumeAudio();
            INPUT.touchJump = true;
            setTimeout(() => INPUT.touchJump = false, 80);
        }, { passive: false });

        // ═══════════════════════════════════════════
        // RENDER LOOP
        // ═══════════════════════════════════════════
        function render() {
            ctx.clearRect(0, 0, W, H);

            drawSky();
            drawGround();

            // Draw obstacles
            obstacles.forEach(drawObstacle);

            // Draw jetpacks
            jetpacks.forEach(drawJetpack);

            // Draw coins
            coins.forEach(drawCoin);

            // Draw player
            if (!PLAYER.dead && !STATE.wastedActive) {
                if (STATE.parachuteActive) {
                    drawParachute();
                } else {
                    drawCharacter(PLAYER.x, PLAYER.y, STATE.currentChar);
                }
            } else if (STATE.parachuteActive) {
                drawParachute();
            }

            // Draw particles
            [...particles, ...dustParticles].forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            });
            ctx.globalAlpha = 1;

            // Draw online players
            if (STATE.gameMode === 'online') {
                Object.entries(onlinePlayers).forEach(([id, data]) => {
                    if (id === onlinePlayerId || data.dead) return;
                    ctx.save();
                    ctx.globalAlpha = 0.6;
                    drawCharacter(data.x || CONFIG.DINO_X, data.y || CONFIG.GROUND_Y, data.char || 0, 0.6);
                    ctx.restore();
                });
            }

            drawHUD();
        }

        function gameLoop() {
            update();
            render();
            if (STATE.frame % 15 === 0) syncOnline();
            requestAnimationFrame(gameLoop);
        }

        // ═══════════════════════════════════════════
        // INITIALIZATION
        // ═══════════════════════════════════════════
        function init() {
            loadState();
            initFirebase();
            initAudio();
            resize();
            resetGame();
            startMusic();

            const resumeOnInteraction = () => {
                resumeAudio();
                document.removeEventListener('click', resumeOnInteraction);
                document.removeEventListener('touchstart', resumeOnInteraction);
            };
            document.addEventListener('click', resumeOnInteraction);
            document.addEventListener('touchstart', resumeOnInteraction);

            gameLoop();
        }

        init();
    })();
    </script>
</body>
